/* ===== サウンド：Web Audio APIでその場で合成するオリジナルBGM・効果音 ===== */
const AudioSys = (() => {
  let ctx = null, master, bgmBus, sfxBus, comp;
  let cur = null, curName = null, timer = null;
  const S = { on: false, bgmOn: true, sfxOn: true, bgmVol: 0.55, sfxVol: 0.8 };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0.9;
    bgmBus = ctx.createGain(); sfxBus = ctx.createGain();
    bgmBus.connect(comp); sfxBus.connect(comp); comp.connect(master); master.connect(ctx.destination);
    applyVol();
    return true;
  }
  function applyVol() {
    if (!ctx) return;
    const t = ctx.currentTime;
    bgmBus.gain.setTargetAtTime(S.on && S.bgmOn ? S.bgmVol * 0.5 : 0, t, 0.1);
    sfxBus.gain.setTargetAtTime(S.on && S.sfxOn ? S.sfxVol : 0, t, 0.05);
  }
  function osc(dest, t, type, f0, f1, dur, g0, attack = 0.004) {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(g0, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  /* ---- 楽器 ---- */
  const I = {
    kick(d, t, v = 1) { osc(d, t, 'sine', 140, 42, 0.38, 0.9 * v); },
    // スネアの代わり：ノイズを使わない音程つきの「タン」
    snare(d, t, v = 1) { osc(d, t, 'triangle', 230, 170, 0.1, 0.3 * v); osc(d, t, 'sine', 340, 300, 0.06, 0.12 * v); },
    tom(d, t, m, v = 1) { osc(d, t, 'sine', mtof(m), mtof(m) * 0.62, 0.45, 0.7 * v); },
    bass(d, t, m, dur, v = 1, wave = 'sawtooth', cut = 520) {
      const o = ctx.createOscillator(); o.type = wave; o.frequency.value = mtof(m);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 6;
      f.frequency.setValueAtTime(cut * 2.4, t); f.frequency.exponentialRampToValueAtTime(cut * 0.6, t + dur);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32 * v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(f); f.connect(g); g.connect(d); o.start(t); o.stop(t + dur + 0.05);
    },
    pad(d, t, ms, dur, v = 1, bright = 1100) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = bright; f.Q.value = 0.5;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045 * v, t + Math.min(0.6, dur * 0.3)); g.gain.setValueAtTime(0.045 * v, t + dur * 0.8); g.gain.linearRampToValueAtTime(0.0001, t + dur * 1.05);
      f.connect(g); g.connect(d);
      ms.forEach((m) => [-6, 6].forEach((det) => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det; o.connect(f); o.start(t); o.stop(t + dur * 1.1); }));
    },
    lead(d, t, m, dur, v = 1, wave = 'square') {
      const o = ctx.createOscillator(); o.type = wave; o.frequency.value = mtof(m);
      const lfo = ctx.createOscillator(); lfo.frequency.value = 5.5; const lg = ctx.createGain(); lg.gain.value = 6; lfo.connect(lg); lg.connect(o.detune);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07 * v, t + 0.02); g.gain.setValueAtTime(0.07 * v, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(f); f.connect(g); g.connect(d); o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
    },
    bell(d, t, m, v = 1, dur = 1.4) {
      [1, 2.01, 3.0, 4.17].forEach((r, i) => osc(d, t, 'sine', mtof(m) * r, 0, dur / (i + 1), 0.09 * v / (i + 1), 0.002));
    },
    brass(d, t, ms, dur, v = 1) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.12); f.frequency.exponentialRampToValueAtTime(900, t + dur);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06 * v, t + 0.05); g.gain.setValueAtTime(0.06 * v, t + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      f.connect(g); g.connect(d);
      ms.forEach((m) => [-8, 0, 8].forEach((det) => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det; o.connect(f); o.start(t); o.stop(t + dur + 0.05); }));
    },
    pluck(d, t, m, v = 1) { I.bass(d, t, m + 24, 0.18, 0.35 * v, 'square', 1400); },
  };
  const triad = (r, minor) => [r, r + (minor ? 3 : 4), r + 7];

  /* ---- 曲データ（すべてオリジナル） ----
     drums: 16ステップの文字列（x=強, o=弱, .=休）  bass/lead: [ステップ, MIDI, 長さ(ステップ)] */
  const T = {
    title: { bpm: 92, bars: 4, chords: [[57, 1], [53, 0], [48, 0], [55, 0]], pad: 900,
      kick: 'x.......x.......', snare: '....x.......x...',
      bass: (bar, root) => [[0, root - 12, 6], [8, root - 12, 6]],
      lead: [[[0, 69, 4], [4, 72, 4], [8, 76, 6], [14, 74, 2]], [[0, 72, 6], [8, 69, 6]], [[0, 67, 4], [4, 72, 4], [8, 71, 6]], [[0, 74, 8], [8, 71, 6]]], leadWave: 'triangle' },
    child: { bpm: 84, bars: 4, chords: [[60, 0], [55, 0], [57, 1], [53, 0]], pad: 700, padV: 0.7,
      bell: [[[0, 72], [4, 76], [8, 79], [12, 76]], [[0, 74], [4, 71], [8, 67], [12, 71]], [[0, 72], [4, 76], [8, 81], [12, 79]], [[0, 77], [4, 76], [8, 74], [12, 72]]] },
    train: { bpm: 118, bars: 4, chords: [[57, 1], [57, 1], [53, 0], [55, 0]], pad: 1000, padV: 0.6,
      kick: 'x...x...x...x...', snare: '....x.......x...',
      bass: (bar, root) => [0, 2, 4, 6, 8, 10, 12, 14].map((s) => [s, root - 24 + (s === 6 || s === 14 ? 12 : 0), 2]),
      pluck: (bar, root) => [[0, root], [3, root + 7], [6, root + 12], [10, root + 3], [13, root + 7]] },
    weighin: { bpm: 70, bars: 4, chords: [[50, 1], [50, 1], [46, 0], [45, 0]], pad: 500, padV: 1.1,
      kick: 'x.........x.....',
      tom: [[0, 45], [10, 43]],
      bass: (bar, root) => [[0, root - 12, 16]], bassWave: 'triangle' },
    entrance: { bpm: 100, bars: 4, chords: [[52, 1], [48, 0], [50, 0], [47, 0]], pad: 1400,
      kick: 'x.....x.x.......', snare: '....x.......x.xx',
      tom: [[12, 52], [13, 50], [14, 47], [15, 45]],
      brass: true, bass: (bar, root) => [[0, root - 12, 6], [6, root - 12, 2], [8, root - 12, 8]] },
    fight: { bpm: 150, bars: 4, chords: [[52, 1], [52, 1], [53, 0], [50, 0]], pad: 1300, padV: 0.5,
      kick: 'x..x..x...x..x..', snare: '....x.......x...',
      bass: (bar, root) => [[0, root - 24, 2], [3, root - 24, 2], [6, root - 12, 1], [7, root - 24, 2], [10, root - 23, 2], [13, root - 24, 2]],
      lead: [[[0, 76, 2], [2, 77, 2], [4, 76, 4]], [[0, 79, 2], [4, 77, 2], [8, 76, 6]], [], [[0, 74, 2], [2, 76, 2], [4, 77, 2], [8, 79, 8]]] },
    victory: { bpm: 128, bars: 4, chords: [[60, 0], [55, 0], [57, 1], [53, 0]], pad: 1600,
      kick: 'x...x...x...x...', snare: '....x.......x...', brass: true,
      bass: (bar, root) => [[0, root - 12, 3], [4, root - 12, 3], [8, root - 12, 3], [12, root - 12, 3]],
      lead: [[[0, 72, 2], [2, 72, 2], [4, 72, 2], [6, 76, 6], [12, 79, 4]], [[0, 79, 6], [8, 77, 2], [10, 76, 2], [12, 74, 4]], [[0, 76, 4], [4, 72, 4], [8, 76, 4], [12, 81, 4]], [[0, 79, 12]]] },
    defeat: { bpm: 64, bars: 4, chords: [[57, 1], [53, 0], [48, 0], [55, 0]], pad: 600, padV: 1,
      bell: [[[0, 69]], [[8, 65]], [[0, 64]], [[8, 62]]] },
    ending: { bpm: 76, bars: 4, chords: [[53, 0], [48, 0], [50, 1], [46, 0]], pad: 1200, padV: 0.9,
      kick: 'x.......x.......',
      bass: (bar, root) => [[0, root - 12, 8], [8, root - 5, 8]], bassWave: 'triangle',
      bell: [[[0, 77], [6, 76], [8, 72], [12, 74]], [[0, 76], [8, 72], [12, 67]], [[0, 74], [4, 77], [8, 81], [12, 79]], [[0, 77], [8, 74], [12, 72]]] },
  };

  function startTrack(name) {
    const tr = T[name]; if (!tr) return null;
    const g = ctx.createGain(); g.gain.value = 0.0001; g.connect(bgmBus);
    g.gain.setTargetAtTime(1, ctx.currentTime + 0.05, 0.6);
    const inst = { name, g, step: 0, next: ctx.currentTime + 0.1, tr, alive: true };
    return inst;
  }
  function schedule(inst) {
    const tr = inst.tr, spb = 60 / tr.bpm / 4;
    while (inst.next < ctx.currentTime + 0.15) {
      const s = inst.step % 16, bar = Math.floor(inst.step / 16) % tr.bars, t = inst.next, d = inst.g;
      const [root, minor] = tr.chords[bar];
      if (s === 0) {
        tr.pad && I.pad(d, t, triad(root, minor), spb * 16, tr.padV || 1, tr.pad);
        tr.brass && I.brass(d, t, triad(root, minor).map((m) => m + 12), spb * 6, 1);
        tr.bass && tr.bass(bar, root).forEach(([st, m, len]) => I.bass(d, t + st * spb, m, len * spb, 1, tr.bassWave || 'sawtooth'));
        tr.lead && (tr.lead[bar] || []).forEach(([st, m, len]) => I.lead(d, t + st * spb, m, len * spb, 1, tr.leadWave || 'square'));
        tr.bell && (tr.bell[bar] || []).forEach(([st, m]) => I.bell(d, t + st * spb, m, 1));
        tr.pluck && tr.pluck(bar, root).forEach(([st, m]) => I.pluck(d, t + st * spb, m));
        tr.tom && tr.tom.forEach(([st, m]) => I.tom(d, t + st * spb, m, 0.8));
      }
      const hit = (pat, fn) => { if (!pat) return; const c = pat[s]; if (c === 'x') fn(1); else if (c === 'o') fn(0.5); };
      hit(tr.kick, (v) => I.kick(d, t, v));
      hit(tr.snare, (v) => I.snare(d, t, v));
      inst.next += spb; inst.step++;
    }
  }
  function tick() { if (cur && cur.alive) schedule(cur); }

  return {
    S,
    load(saved) { Object.assign(S, saved || {}); },
    enable(on) {
      S.on = on;
      if (on) { if (!init()) return; if (ctx.state === 'suspended') ctx.resume(); if (!timer) timer = setInterval(tick, 30); if (curName && !cur) { const n = curName; curName = null; this.bgm(n); } }
      applyVol();
    },
    setVol() { applyVol(); },
    bgm(name) {
      if (name === curName) return;
      curName = name;
      if (!ctx || !S.on) return;
      if (cur) { const old = cur; old.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.5); setTimeout(() => { old.alive = false; old.g.disconnect(); }, 2500); }
      cur = startTrack(name);
    },
    sfx(name) {
      if (!ctx || !S.on || !S.sfxOn) return;
      const t = ctx.currentTime + 0.01, d = sfxBus;
      switch (name) {
        case 'punch': osc(d, t, 'sine', 170, 60, 0.12, 0.65); osc(d, t, 'triangle', 95, 70, 0.06, 0.3); break;
        case 'kick': osc(d, t, 'sine', 130, 42, 0.2, 0.85); osc(d, t, 'square', 75, 60, 0.03, 0.08); break;
        case 'ko': osc(d, t, 'sine', 80, 30, 0.6, 1); osc(d, t, 'triangle', 55, 40, 0.4, 0.5); chord(d, t + 0.25, [60, 64, 67, 72], 1.4, 0.05); break;
        case 'bell': [1, 2.74, 5.1, 8.3].forEach((r, i) => osc(d, t, 'sine', 820 * r, 0, 1.6 / (i * 0.6 + 1), 0.22 / (i + 1), 0.001)); break;
        case 'crowd': chord(d, t, [55, 59, 62], 1.2, 0.035); break;
        case 'cheer': [72, 76, 79, 84].forEach((m, i) => osc(d, t + i * 0.09, 'triangle', mtof(m), 0, 0.35, 0.12)); break;
        case 'groan': osc(d, t, 'sine', 330, 196, 0.9, 0.12, 0.05); osc(d, t + 0.05, 'sine', 262, 165, 0.9, 0.08, 0.05); break;
        case 'scale': osc(d, t, 'square', 1250, 0, 0.08, 0.12); osc(d, t + 0.14, 'square', 1250, 0, 0.08, 0.12); osc(d, t + 0.45, 'sine', 160, 80, 0.25, 0.5); break;
        case 'stamp': osc(d, t, 'sine', 120, 50, 0.3, 0.9); osc(d, t, 'square', 90, 70, 0.02, 0.06); break;
        case 'select': osc(d, t, 'triangle', 880, 0, 0.06, 0.08); break;
        case 'stat': osc(d, t, 'triangle', 1046, 0, 0.1, 0.08); osc(d, t + 0.07, 'triangle', 1318, 0, 0.12, 0.08); break;
      }
    },
  };
  /* 歓声の代わり：ノイズを使わない、ゆっくり立ち上がる和音 */
  function chord(d, t, ms, dur, v) {
    ms.forEach((m) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m); const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + dur * 0.35); g.gain.linearRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(d); o.start(t); o.stop(t + dur + 0.05); });
  }
})();

/* ===== UI ===== */
const $ = (s) => document.querySelector(s);
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const SPEEDS = [1, 2, 4, 8, 16];
const SET = { speedIdx: 0, paused: false, auto: false, autoMode: 'important', manualFight: false, autoAdvance: true, vibe: true, digest: true };
const spd = () => SPEEDS[SET.speedIdx] || 1;

const UI = {
  bot: null,
  waiter: null,
  pageLines: 0,
  nominal: 0, // 1x換算の経過時間（計測用）
  stats: { choices: 0, autoChoices: 0, inputs: 0 },

  /* --- 時間：倍速・一時停止・タップでスキップ --- */
  wait(ms) {
    if (this.bot) return Promise.resolve();
    this.nominal += ms;
    return new Promise((res) => {
      let left = ms, last = performance.now();
      const tick = () => {
        const now = performance.now(); const dt = Math.min(250, now - last); last = now;
        if (!SET.paused) left -= dt * spd();
        if (this.skipNow) { this.skipNow = false; left = 0; }
        if (left <= 0) { this.skipper = null; res(); } else setTimeout(tick, 30);
      };
      this.skipper = () => { left = 0; };
      tick();
    });
  },
  waitTap() {
    if (this.bot) return Promise.resolve();
    this.showHint(true);
    return new Promise((res) => { this.waiter = () => { this.waiter = null; this.showHint(false); res(); }; });
  },
  showHint(manual) {
    const t = $('#tapnext');
    $('#choices').hidden = true;
    t.hidden = false;
    t.textContent = SET.paused ? '一時停止中　▶ で再開' : manual ? 'タップで次へ ▼' : '自動で進行中　タップで次へ ▶';
    t.classList.toggle('flow', !manual);
  },
  tap() {
    if (SET.paused) return;
    if (this.typing) { this.typing(); this.skipNow = true; return; }
    if (this.waiter) { this.waiter(); return; }
    if (this.fightSkip) { this.fightSkip(); return; }
    if (this.autoPickNow) { this.autoPickNow(); return; }
    if (this.skipper) this.skipper();
  },
  async pace(text) {
    // 1行の読み時間（1x）: 0.7秒 + 1文字あたり40ms
    if (SET.autoAdvance) { this.showHint(false); await this.wait(700 + String(text).length * 40); }
    else await this.waitTap();
  },

  log() { return $('#log'); },
  newPage() { if (this.bot) return; const l = this.log(); l.innerHTML = ''; this.pageLines = 0; },
  addLine(text, cls) {
    if (this.pageLines >= 3) this.newPage();
    const p = h('p', 'ln ' + (cls || ''));
    if (text) p.textContent = text;
    this.log().appendChild(p);
    this.pageLines++;
    this.scrollDown();
    return p;
  },
  scrollDown() { const s = $('#stage'); s.scrollTop = s.scrollHeight; },
  type(p, text) {
    this.nominal += text.length * 22;
    if (spd() >= 8 || matchMedia('(prefers-reduced-motion: reduce)').matches) { p.textContent = text; return Promise.resolve(); }
    return new Promise((res) => {
      let i = 0;
      const iv = setInterval(() => {
        if (SET.paused) return;
        i += spd(); p.textContent = text.slice(0, i);
        if (i >= text.length) { clearInterval(iv); this.typing = null; res(); }
      }, 22);
      this.typing = () => { clearInterval(iv); p.textContent = text; this.typing = null; res(); };
    });
  },
  async say(lines, cls) {
    if (this.bot) return;
    for (const t of lines) {
      if (!t) continue;
      const p = this.addLine('', cls);
      await this.type(p, t);
      await this.pace(t);
    }
  },
  async delta(text) {
    if (this.bot || !text) return;
    AudioSys.sfx('stat');
    if (LCD && !LCD.st.fight) LCD.bubble(/[+＋]/.test(text) ? 'star' : 'sweat', 1400);
    // 能力の変化は、原因になった行のすぐ下に小さく添える（画面の上に重ねない）
    const lines = this.log().querySelectorAll('.ln:not(.year)');
    const host = lines.length ? lines[lines.length - 1] : this.addLine('', 'dhost');
    host.appendChild(h('span', 'dchip', text));
    this.scrollDown();
  },
  note(text, cls) { if (this.bot || !text) return; this.addLine(text, cls); },
  async ask(lines) {
    if (this.bot) return;
    const ls = lines.filter(Boolean);
    if (!ls.length) return;
    await this.say(ls.slice(0, -1));
    const p = this.addLine('', '');
    await this.type(p, ls[ls.length - 1]);
  },
  async yearLine(year, age, sub) {
    if (this.bot) return;
    if (this.pageLines >= 2) this.newPage();
    const p = this.addLine('', 'year');
    p.appendChild(h('b', null, age + '歳'));
    p.appendChild(h('span', null, year + '年' + (sub ? '　' + sub : '')));
    await this.wait(1400);
  },
  async milestone(age, year) {
    if (this.bot) return;
    this.newPage();
    const c = h('div', 'chapter ms');
    c.appendChild(h('div', 'ch-sub', year + '年　時間が止まる'));
    c.appendChild(h('h2', 'ch-title', age + '歳'));
    this.log().appendChild(c);
    this.pageLines = 2;
    AudioSys.sfx('bell');
    await this.wait(1400);
  },
  async chapter(title, sub) {
    if (this.bot) return;
    this.newPage();
    const c = h('div', 'chapter');
    c.appendChild(h('div', 'ch-sub', sub || ''));
    c.appendChild(h('h2', 'ch-title', title));
    this.log().appendChild(c);
    this.pageLines = 1;
    if (SET.autoAdvance) { this.showHint(false); await this.wait(1600); } else await this.waitTap();
    this.newPage();
  },
  async announce(lines) {
    if (this.bot) return;
    this.newPage();
    for (const t of lines) {
      const p = h('p', 'announce', t);
      this.log().appendChild(p); this.pageLines++;
      AudioSys.sfx('crowd');
      await this.pace(t.slice(0, 20));
    }
    this.newPage();
  },

  /* --- 選択肢（オート対応） --- */
  autoApplies(meta) {
    if (!SET.auto || meta.always) return false;
    if (meta.fight && SET.manualFight) return false;
    if (meta.imp && SET.autoMode === 'important') return false;
    return true;
  },
  choose(opts, meta = {}) {
    if (this.bot) return Promise.resolve(this.bot('choose', opts, meta));
    this.stats.choices++;
    return new Promise((res) => {
      const box = $('#choices');
      $('#tapnext').hidden = true;
      box.hidden = false; document.body.classList.add('choosing');
      const auto = this.autoApplies(meta);
      const autoIdx = auto ? autoChoose(opts, meta) : -1;
      if (LCD && !LCD.st.fight) LCD.bubble('q', 1800);
      let page = 0, done = false;
      const per = opts.length > 4 ? 3 : 4;
      if (auto) page = Math.floor(autoIdx / per);
      const finish = (idx, byAuto) => {
        if (done) return; done = true;
        this.autoPickNow = null;
        document.body.classList.remove('choosing');
        AudioSys.sfx('select');
        box.innerHTML = ''; box.hidden = true;
        this.addLine('▶ ' + opts[idx].label + (byAuto ? '（オート）' : ''), 'chosen' + (byAuto ? ' auto' : ''));
        if (byAuto) this.stats.autoChoices++;
        res(idx);
      };
      const render = () => {
        box.innerHTML = '';
        opts.slice(page * per, page * per + per).forEach((o, j) => {
          const idx = page * per + j;
          const b = h('button', 'choice' + (idx === autoIdx ? ' auto-pick' : ''));
          b.type = 'button';
          b.appendChild(h('span', 'c-label', o.label));
          if (o.sub) b.appendChild(h('span', 'c-sub', o.sub));
          if (o.disabled) b.disabled = true;
          b.onclick = (e) => { e.stopPropagation(); finish(idx, false); };
          box.appendChild(b);
        });
        if (opts.length > per) {
          const more = h('button', 'choice more', (page + 1) * per < opts.length ? 'ほかの選択肢 ▸' : '◂ 戻る');
          more.type = 'button';
          more.onclick = (e) => { e.stopPropagation(); page = (page + 1) * per < opts.length ? page + 1 : 0; render(); };
          box.appendChild(more);
        }
      };
      render();
      this.scrollDown();
      if (auto) {
        // オートの選択を少しだけ見せる（その間にタップすれば自分で選べる）
        this.autoPickNow = () => finish(autoIdx, true);
        this.wait(1100).then(() => finish(autoIdx, true));
      }
    });
  },
  async tactic(fs, b) {
    const ring = RULES[fs.rule].ring;
    const keys = ['strike', 'td', 'counter', 'wall', 'pull', 'pace'];
    const opts = keys.map((k) => ({ label: k === 'wall' ? (ring ? 'ロープ際で削る' : '金網際で削る') : TACTICS[k].l, sub: tacticSub(k, fs) }));
    const i = await this.choose(opts, { kind: 'tactic', fs, fight: true });
    return keys[i];
  },

  // 黒い額縁とリボンの遺影（胸から上）。中の人物は白黒
  const g = new Grid(28, 28);
  g.rect(0, 0, 28, 28, 'K'); g.rect(2, 2, 24, 24, 'L'); g.rect(2, 20, 24, 6, 'G');
  const sp = charGrid({ ...lk, gloves: false, cane: false }, 'idle', 0);
  const y0 = lk.age < 13 ? 5 : lk.age < 18 ? 3 : 1;
  for (let y = 0; y < 23; y++) for (let x = 0; x < 22; x++) { const v = sp.get(x + 5, y + y0 - 1); if (v) g.set(x + 3, y + 3, v); }
  g.rect(0, 0, 28, 2, 'K'); g.rect(0, 26, 28, 2, 'K'); g.rect(0, 0, 2, 28, 'K'); g.rect(26, 0, 2, 28, 'K');
  for (let i = 0; i < 5; i++) { g.rect(2, 2 + i, 5 - i, 1, 'K'); g.rect(21 + i, 2 + i, 5 - i, 1, 'K'); }
  return gridCanvas(g, true);
}
function senderLookSafe(from) { try { return senderLook(from); } catch (e) { return { age: 50, hair: 'short', top: 'suit' }; } }

/* --- 結果カードの画像（Canvas：画面と同じレトロなエンディング） --- */
function cardTexts(c) {
  return [c.title, c.nick || '', c.name, c.rec.w + '勝' + c.rec.l + '敗分', '0123456789偏差値年―享年人生完▶', c.home + '出身・' + (c.cls || '—') + '・' + c.gym, 'KO/TKO一本判定格闘家人生シミュレーター#最高の瞬間共に生きた人最後に、この人へ人生の一言（）歳タイトル最高位連れ添った人共に暮らした動物犬猫の、', c.partner || '', (c.pets || []).join(''), c.moment.t, c.moment.s, c.finalWord || '', c.lastWord ? c.lastWord.t : '', c.peak, (c.titles || []).join('')].join('');
}
async function loadCardFonts(c) {
  const t = cardTexts(c);
  try { await Promise.all([document.fonts.load('64px "DotGothic16"', t), document.fonts.load('700 40px "Zen Kaku Gothic New"', t), document.fonts.load('500 36px "Zen Kaku Gothic New"', t)]); } catch (e) { /* noop */ }
}
async function drawCard(c) {
  const W = 1080, H = 1920;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.imageSmoothingEnabled = false;
  const dot = '"DotGothic16", "Hiragino Kaku Gothic StdN", monospace';
  const body = '"Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif';
  x.fillStyle = PX.K; x.fillRect(0, 0, W, H);
  // ドットの二重枠
  x.fillStyle = PX.W; x.fillRect(24, 24, W - 48, H - 48); x.fillStyle = PX.K; x.fillRect(32, 32, W - 64, H - 64);
  x.fillStyle = PX.D; x.fillRect(44, 44, W - 88, H - 88); x.fillStyle = PX.K; x.fillRect(52, 52, W - 104, H - 104);
  x.fillStyle = PX.L; x.font = '36px ' + dot; x.textAlign = 'center'; x.fillText('格闘家人生シミュレーター', W / 2, 120);
  // 全盛期の場面（112×80 を 6倍）
  const sc = endingCanvas(c);
  x.fillStyle = PX.W; x.fillRect(196, 146, 688, 496); x.drawImage(sc, 204, 154, 672, 480);
  x.fillStyle = PX.Y; fitText(x, c.title, W / 2, 730, W - 160, 84, dot);
  let y = 800;
  if (c.nick) { x.fillStyle = PX.O; fitText(x, '"' + c.nick + '"', W / 2, y, W - 160, 38, dot); y += 62; }
  x.fillStyle = PX.W; y = fitText(x, c.name, W / 2, y + 14, W - 160, 72, dot) + 58;
  x.fillStyle = PX.L; x.font = '500 32px ' + body; x.fillText(c.birthYear + '年 ― ' + c.deathYear + '年　享年' + (c.death || '—'), W / 2, y); y += 44;
  x.font = '500 26px ' + body; fitText(x, c.home + '出身・' + (c.cls || '—') + '・' + c.gym, W / 2, y, W - 160, 26, body); y += 110;
  x.fillStyle = PX.W; fitText(x, c.rec.w + '勝' + c.rec.l + '敗' + (c.rec.d ? c.rec.d + '分' : ''), W / 2, y, W - 160, 90, dot); y += 28;
  [['KO/TKO', c.rec.ko], ['一本', c.rec.sub], ['判定', c.rec.dec]].forEach(([l, v], i) => {
    const bx = 120 + i * 290;
    x.fillStyle = PX.D; x.fillRect(bx, y, 260, 104); x.fillStyle = PX.K; x.fillRect(bx + 6, y + 6, 248, 92);
    x.fillStyle = PX.R; x.font = '58px ' + dot; x.fillText(String(v), bx + 130, y + 64);
    x.fillStyle = PX.L; x.font = '24px ' + dot; x.fillText(l, bx + 130, y + 92);
  });
  y += 160;
  x.textAlign = 'left';
  x.fillStyle = PX.Y; x.font = '28px ' + dot; x.fillText('▶ 最高の瞬間', 110, y);
  x.fillStyle = PX.W; x.font = '700 34px ' + body; y = wrap(x, c.moment.t, 110, y + 48, W - 220, 44);
  x.fillStyle = PX.L; x.font = '500 27px ' + body; y = wrap(x, c.moment.s, 110, y + 40, W - 220, 36) + 66;
  const rows = [['最後に、この人へ', '「' + (c.finalWord || 'ありがとう。') + '」']];
  if (c.partner) rows.push(['連れ添った人', c.partner]);
  if (c.pets && c.pets.length) rows.push(['共に暮らした動物', c.pets.join('、')]);
  if (c.lastWord) rows.push(['人生の一言・' + c.lastWord.age + '歳', '「' + c.lastWord.t + '」']);
  rows.push(['最高位', c.peak]);
  for (const [a, b] of rows) {
    if (y > H - 270) break;
    x.fillStyle = PX.R; x.font = '26px ' + dot; x.fillText(a, 110, y);
    const lw = x.measureText(a).width + 24;
    x.fillStyle = PX.W; x.font = '700 32px ' + body; y = wrap(x, b, 110 + lw, y, W - 220 - lw, 42) + 60;
  }
  x.textAlign = 'center'; x.fillStyle = PX.L; x.font = '40px ' + dot; x.fillText('― 完 ―', W / 2, H - 210);
  x.fillStyle = PX.R; x.fillRect(52, H - 160, W - 104, 108);
  x.fillStyle = PX.W; x.font = '44px ' + dot; x.textAlign = 'left'; x.fillText('人生偏差値 ' + hensachi(c.score), 90, H - 90);
  x.font = '28px ' + dot; x.textAlign = 'right'; x.fillText('#格闘家人生シミュレーター', W - 90, H - 92); x.textAlign = 'left';
  return cv;
}
/* 幅に収まるまで文字を小さくする（名前が切れないように） */
function fitText(x, text, X, Y, maxW, size, face) {
  let s = size;
  x.font = s + 'px ' + face;
  while (s > 36 && x.measureText(text).width > maxW) { s -= 4; x.font = s + 'px ' + face; }
  if (x.measureText(text).width > maxW) { const al = x.textAlign; x.textAlign = 'left'; const yy = wrap(x, text, al === 'center' ? X - maxW / 2 : X, Y, maxW, s * 1.15); x.textAlign = al; return yy; }
  x.fillText(text, X, Y);
  return Y;
}

/* ===== 起動・タイトル画面 ===== */
function saveSettings() { Store.set(SET_KEY, { v: 2, audio: { ...AudioSys.S }, speedIdx: SET.speedIdx, auto: SET.auto, autoMode: SET.autoMode, manualFight: SET.manualFight, autoAdvance: SET.autoAdvance, vibe: SET.vibe, digest: SET.digest }); }
function updateCtrl() {
  document.querySelectorAll('#speedseg button').forEach((b) => { const on = +b.dataset.i === SET.speedIdx; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  const p = $('#btn-pause'); p.textContent = SET.paused ? '▶' : '❚❚'; p.classList.toggle('on', SET.paused); p.setAttribute('aria-pressed', SET.paused ? 'true' : 'false'); p.setAttribute('aria-label', SET.paused ? '再開' : '一時停止');
  const a = $('#btn-auto'); a.classList.toggle('on', SET.auto); a.setAttribute('aria-pressed', SET.auto ? 'true' : 'false');
  const ml = !SET.auto ? 'OFF' : (SET.autoMode === 'all' ? '全部おまかせ' : '大事な場面で停止') + (SET.manualFight ? '・試合手動' : '');
  $('#auto-mode').textContent = ml;
  a.setAttribute('aria-label', 'オート：' + ml);
  document.querySelectorAll('#autopanel button').forEach((b) => {
    const m = b.dataset.mode;
    const on = m === 'fight' ? SET.manualFight : m === 'off' ? !SET.auto : SET.auto && SET.autoMode === m;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.body.classList.toggle('paused', SET.paused);
  const t = $('#tapnext'); if (!t.hidden && t.classList.contains('flow')) t.textContent = SET.paused ? '一時停止中　▶ で再開' : '自動で進行中　タップで次へ ▶';
}
function updateSoundBtn() {
  const on = AudioSys.S.on;
  const hb = $('#btn-snd');
  if (hb) { hb.textContent = on ? '音ON' : '音OFF'; hb.setAttribute('aria-label', on ? 'サウンドをオフにする' : 'サウンドをオンにする'); }
  const b = $('#btn-sound');
  if (!b) return;
  b.textContent = on ? 'サウンド：ON（タップでOFF）' : 'サウンドON';
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.classList.toggle('on', on);
}
function syncSoundPanel() {
  const S = AudioSys.S;
  const p = $('#sp-power'); p.textContent = S.on ? 'サウンド：ON（タップでOFF）' : 'サウンド：OFF（タップでON）'; p.classList.toggle('on', S.on); p.setAttribute('aria-pressed', S.on ? 'true' : 'false');
  $('#sp-bgmv').value = S.bgmVol; $('#sp-sfxv').value = S.sfxVol; $('#sp-sfxon').checked = S.sfxOn; $('#sp-bgmon').checked = S.bgmOn;
}
function validSave(s) { return s && s.v === 2 && s.s && s.queue && s.phase !== 'dead'; }

function boot() {
  const st = Store.get(SET_KEY, null);
  if (st) {
    AudioSys.load({ ...st.audio, on: false }); SET.vibe = st.vibe !== false; SET.digest = st.digest !== false;
    if (st.v === 2) { SET.speedIdx = clamp(st.speedIdx | 0, 0, 4); SET.auto = !!st.auto; SET.autoMode = st.autoMode === 'all' ? 'all' : 'important'; SET.manualFight = !!st.manualFight; SET.autoAdvance = st.autoAdvance !== false; }
  }
  document.querySelectorAll('#speedseg button').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); SET.speedIdx = +b.dataset.i; saveSettings(); updateCtrl(); }));
  $('#btn-pause').addEventListener('click', (e) => { e.stopPropagation(); SET.paused = !SET.paused; updateCtrl(); });
  $('#btn-auto').addEventListener('click', (e) => {
    e.stopPropagation();
    const pnl = $('#autopanel'); pnl.hidden = !pnl.hidden; $('#soundpanel').hidden = true;
    $('#btn-auto').setAttribute('aria-expanded', pnl.hidden ? 'false' : 'true');
  });
  document.querySelectorAll('#autopanel button').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const m = b.dataset.mode;
    if (m === 'fight') { SET.manualFight = !SET.manualFight; }
    else if (m === 'off') { SET.auto = false; $('#autopanel').hidden = true; }
    else { SET.auto = true; SET.autoMode = m; $('#autopanel').hidden = true; }
    $('#btn-auto').setAttribute('aria-expanded', $('#autopanel').hidden ? 'false' : 'true');
    saveSettings(); updateCtrl();
  }));
  LCD = makeLCD($('#lcd')); LCDS.push(LCD);
  TITLE_LCD = makeLCD($('#title-lcd')); LCDS.push(TITLE_LCD);
  fitLCD(false);
  window.addEventListener('resize', () => { fitLCD($('#lcdwrap').classList.contains('zoom')); UI.scrollDown(); });
  $('#peerbar').addEventListener('click', (e) => { e.stopPropagation(); UI.peerSheet(); });
  updateCtrl();
  $('#stage').addEventListener('click', () => { if (!$('#soundpanel').hidden || !$('#autopanel').hidden) { $('#soundpanel').hidden = true; $('#autopanel').hidden = true; return; } UI.tap(); });
  $('#tapnext').addEventListener('click', (e) => { e.stopPropagation(); UI.tap(); });
  document.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !(document.activeElement && ['BUTTON', 'INPUT', 'SELECT', 'A'].includes(document.activeElement.tagName))) { e.preventDefault(); UI.tap(); }
  });
  $('#btn-menu').addEventListener('click', () => UI.menu());
  $('#btn-snd').addEventListener('click', (e) => {
    e.stopPropagation();
    const sp = $('#soundpanel'); sp.hidden = !sp.hidden; $('#autopanel').hidden = true;
    $('#btn-snd').setAttribute('aria-expanded', sp.hidden ? 'false' : 'true');
    syncSoundPanel();
  });
  $('#sp-power').addEventListener('click', (e) => { e.stopPropagation(); AudioSys.enable(!AudioSys.S.on); saveSettings(); updateSoundBtn(); syncSoundPanel(); });
  $('#sp-bgmv').addEventListener('input', () => { AudioSys.S.bgmVol = +$('#sp-bgmv').value; AudioSys.setVol(); saveSettings(); });
  $('#sp-sfxv').addEventListener('input', () => { AudioSys.S.sfxVol = +$('#sp-sfxv').value; AudioSys.setVol(); saveSettings(); });
  $('#sp-sfxv').addEventListener('change', () => AudioSys.sfx('select'));
  $('#sp-sfxon').addEventListener('change', () => { AudioSys.S.sfxOn = $('#sp-sfxon').checked; AudioSys.setVol(); saveSettings(); });
  $('#sp-bgmon').addEventListener('change', () => { AudioSys.S.bgmOn = $('#sp-bgmon').checked; AudioSys.setVol(); saveSettings(); });
  $('#soundpanel').addEventListener('click', (e) => e.stopPropagation());
  $('#statsbar').addEventListener('click', (e) => { e.stopPropagation(); UI.statusSheet(); });
  $('#statsbar').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); UI.statusSheet(); } });
  $('#lcdwrap').addEventListener('click', () => { if (!$('#soundpanel').hidden || !$('#autopanel').hidden) { $('#soundpanel').hidden = true; $('#autopanel').hidden = true; return; } UI.tap(); });
  showTitle();
}

function showTitle() {
  const t = $('#title'); t.hidden = false;
  $('#hud').hidden = true; $('#lcdwrap').hidden = true;
  document.body.dataset.scene = 'title';
  document.body.classList.remove('dimmed', 'battle', 'choosing');
  titleDemo();
  AudioSys.bgm('title');
  const save = Store.get(SAVE_KEY, null);
  const box = $('#title-btns'); box.innerHTML = '';
  const btn = (label, cls, fn, id) => { const b = h('button', 'choice ' + (cls || ''), label); b.type = 'button'; if (id) b.id = id; b.onclick = fn; box.appendChild(b); return b; };
  btn('サウンドON', 'sound', () => { AudioSys.enable(!AudioSys.S.on); if (AudioSys.S.on) AudioSys.bgm('title'); saveSettings(); updateSoundBtn(); }, 'btn-sound');
  if (validSave(save)) {
    const b = btn('つづきから', 'primary', () => continueGame(save));
    b.appendChild(h('span', 'c-sub', save.sei + ' ' + save.mei + '・' + save.age + '歳'));
  }
  btn('はじめから（新しい人生）', validSave(save) ? '' : 'primary', () => startNew());
  btn('墓碑録（これまでの人生）', '', () => tombSheet());
  btn('設定（オート・速さ・サウンド）', '', () => UI.settingsSheet());
  updateSoundBtn();
}
/* タイトルの小窓：ひとりの一生が、くり返し流れる */
let TITLE_LCD = null, titleTimer = null;
function titleDemo() {
  if (!TITLE_LCD) return;
  const scenes = [
    [1, 'home', 'sit', {}], [8, 'dojo', 'guard', { top: 'gi', topC: 'W' }], [15, 'school', 'walk', { top: 'tee', topC: 'W' }],
    [22, 'gym', 'sandbag', { gloves: true }], [27, 'ring', 'raise', { gloves: true, belt: true }], [45, 'gym', 'walk', { top: 'tee', topC: 'R' }], [80, 'oldhome', 'sit', { top: 'tee', topC: 'G' }],
  ];
  let i = 0;
  const show = () => {
    const [age, place, act, extra] = scenes[i % scenes.length];
    const lk = { age, hair: age >= 72 ? 'old' : 'spiky', hairC: age >= 72 ? 'W' : 'H', build: age >= 45 ? 'l' : 'm', top: 'bare', glasses: age >= 66, cane: age >= 76, ...extra };
    TITLE_LCD.setPlace(place, { season: ['spring', 'summer', 'autumn', 'winter'][i % 4], night: place === 'ring' });
    TITLE_LCD.setHero(lk); TITLE_LCD.setActivity(act);
    if (act === 'raise') TITLE_LCD.bubble('star', 2000);
    const t = $('#title-age'); if (t) t.textContent = age + '歳';
    if (!$('#title').hidden) TITLE_LCD.draw();
    i++;
  };
  show();
  clearInterval(titleTimer);
  titleTimer = setInterval(() => { if ($('#title').hidden) { clearInterval(titleTimer); return; } show(); }, 2200);
}
function hallSheet() {
  UI.sheet('歴代の人生', (b) => {
    const hall = Store.get(HALL_KEY, []);
    if (!hall.length) { b.appendChild(h('p', 'empty', 'まだ記録はありません。最初の人生を生きてみよう。')); return; }
    const ol = h('ol', 'rk-list');
    hall.forEach((x) => {
      const li = h('li', 'rk');
      li.appendChild(h('span', 'rk-n', String(hensachi(x.score))));
      li.appendChild(h('span', 'rk-name', (x.nick ? '"' + x.nick + '" ' : '') + x.name));
      li.appendChild(h('span', 'rk-org', x.rec + (x.titles ? '・王座' + x.titles : '') + (x.age ? '・享年' + x.age : '')));
      ol.appendChild(li);
    });
    b.appendChild(h('p', 'credit', '左の数字は格闘家人生偏差値。'));
    b.appendChild(ol);
  });
}
async function startNew() {
  $('#title').hidden = true;
  UI.newPage();
  newLife((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
  ArtState.place = null; ArtState.key = '';
  UI.hud();
  setPlace();
  await play();
}
async function continueGame(s) {
  $('#title').hidden = true;
  P = s;
  P.tmp = P.tmp || {};
  ArtState.place = null; ArtState.key = '';
  UI.newPage();
  setPlace();
  UI.hud();
  await play();
}
async function play() {
  try {
    await runGame();
  } catch (e) {
    console.error(e);
    UI.newPage();
    UI.addLine('エラーが発生しました。タイトルから「つづきから」で再開できます。', 'delta');
  }
  showTitle();
}
if (typeof document !== 'undefined' && document.getElementById('app')) boot();
