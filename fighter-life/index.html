<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>格闘家人生シミュレーター</title>
<meta name="description" content="日本の格闘技オタクのための、MMAファイター人生シミュレーション。">
<meta name="theme-color" content="#36324C">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="格闘家人生">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>/* 携帯ゲーム機のような、ドット絵の小窓が主役の画面。色は16色パレットだけを使う（ダークモードも同じ系統）。 */
:root {
  --K: #191826; --D: #36324C; --G: #6D6987; --L: #B4B0C6; --W: #F3F0E4; --S: #F1BC93; --R: #D8443A; --r: #84242C; --B: #3C6BD6; --C: #8CC8EE; --Y: #F4C548; --O: #E98A3B; --E: #5AA85C; --e: #2C5E44;
  --bg: var(--W); --surface: var(--W); --panel: #E9E5D6; --ink: var(--K); --muted: var(--G); --line: var(--K); --soft-line: var(--L);
  --accent: var(--R); --accent-text: var(--r); --accent-ink: var(--W); --good: var(--e); --hi: var(--Y);
  --dot: "DotGothic16", "Hiragino Kaku Gothic StdN", "Yu Gothic", monospace;
  --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --px: 3px; --lcd-w: 336px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: var(--K); --surface: var(--D); --panel: var(--D); --ink: var(--W); --muted: var(--L); --line: var(--G); --soft-line: var(--D); --accent: var(--R); --accent-text: var(--O); --good: var(--E); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: var(--K); --surface: var(--D); --panel: var(--D); --ink: var(--W); --muted: var(--L); --line: var(--G); --soft-line: var(--D); --accent: var(--R); --accent-text: var(--O); --good: var(--E); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, select, input { font: inherit; color: inherit; }
canvas.px, .px { image-rendering: pixelated; image-rendering: crisp-edges; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { height: 100%; height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; overflow: hidden; }
:focus-visible { outline: 3px solid var(--B); outline-offset: 2px; }

/* ---------- 上の帯：名前・年齢・年／倍速・オート ---------- */
#hud { flex: none; background: var(--bg); padding-block: max(6px, env(safe-area-inset-top, 0px)) 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); position: relative; z-index: 3; }
.hud-top { display: flex; align-items: center; gap: 6px; }
.hud-who { flex: 1; min-width: 0; line-height: 1.25; }
#hud-name { display: block; font-family: var(--dot); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud-meta { display: block; font-family: var(--dot); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: none; min-width: 44px; height: 40px; border: 2px solid var(--line); border-radius: 0; background: var(--surface); font-family: var(--dot); font-size: 14px; cursor: pointer; padding: 0 8px; box-shadow: 2px 2px 0 var(--line); }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: none; }

.ctrl { display: flex; gap: 6px; align-items: stretch; margin-top: 6px; }
.ctl { flex: none; min-width: 44px; height: 40px; border: 2px solid var(--line); border-radius: 0; background: var(--surface); color: var(--ink); font-family: var(--dot); font-size: 14px; cursor: pointer; padding: 0 8px; }
.ctl.on { background: var(--ink); color: var(--bg); }
.seg { flex: 1; min-width: 0; display: flex; border: 2px solid var(--line); background: var(--surface); }
.seg button { flex: 1; min-width: 0; height: 36px; border: 0; border-left: 2px solid var(--line); background: transparent; color: var(--muted); font-family: var(--dot); font-size: 15px; cursor: pointer; padding: 0; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--ink); color: var(--bg); }
.ctl.auto { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 8px; min-width: 88px; max-width: 128px; line-height: 1.1; }
.ctl.auto small { font-size: 10px; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl.auto span { font-size: 14px; }
.ctl.auto.on { background: var(--accent); color: var(--W); border-color: var(--line); }
.ctl.auto.on small { color: var(--W); }

.autopanel, .soundpanel { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: calc(100% - 6px); z-index: 8; display: grid; gap: 6px; padding: 10px; background: var(--surface); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--line); }
.autopanel[hidden], .soundpanel[hidden] { display: none; }
.autopanel button { display: grid; gap: 2px; text-align: left; min-height: 52px; padding: 6px 12px; border: 2px solid var(--soft-line); border-radius: 0; background: var(--bg); cursor: pointer; }
.autopanel button b { font-family: var(--dot); font-weight: 400; font-size: 15px; }
.autopanel button small { font-size: 12px; color: var(--muted); }
.autopanel button.on { border-color: var(--accent); }
.autopanel button.on b::before { content: "▶ "; color: var(--accent-text); }
.sp-power { min-height: 48px; border: 2px solid var(--line); border-radius: 0; background: var(--bg); font-family: var(--dot); cursor: pointer; }
.sp-power.on { background: var(--ink); color: var(--bg); }
.sp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 14px; }
.sp-row input[type="range"] { width: 55%; accent-color: var(--accent); }
.sp-row input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--accent); }

/* 年表：ドットのアイコンをつないだ帯 */
#timeline { margin-top: 6px; height: 24px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; border-top: 2px solid var(--soft-line); border-bottom: 2px solid var(--soft-line); padding-top: 2px; }
#timeline::-webkit-scrollbar { display: none; }
#timeline[hidden] { display: none; }
#timeline canvas { display: block; }

/* ---------- 液晶の小窓 ---------- */
#lcdwrap { flex: none; display: flex; flex-direction: column; align-items: center; padding: 8px 12px 0; cursor: pointer; }
#lcdwrap[hidden] { display: none; }
.bezel { background: var(--D); padding: 6px; border: 3px solid var(--K); box-shadow: 4px 4px 0 var(--K); transition: background .3s; }
:root[data-theme="dark"] .bezel { box-shadow: 4px 4px 0 #000; }
#lcdwrap.zoom .bezel { background: var(--Y); }
#lcdwrap.zoom[data-kind="injury"] .bezel, #lcdwrap.zoom[data-kind="retire"] .bezel { background: var(--L); }
.screen { position: relative; line-height: 0; border: 2px solid var(--K); background: var(--K); }
#lcd { display: block; width: var(--lcd-w); transition: filter 2.4s ease; }
#lcd-top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: end; padding: 0 2px 4px; color: var(--W); font-family: var(--dot); font-size: 12px; line-height: 1.2; max-width: var(--lcd-w); }
#lcd-top[hidden] { display: none; }
.lt-n { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt-n.me::before { content: "■"; color: var(--R); margin-right: 3px; }
.lt-n.op { text-align: right; }
.lt-n.op::after { content: "■"; color: var(--B); margin-left: 3px; }
.lt-mid { display: grid; text-align: center; }
.lt-mid b { font-weight: 400; color: var(--Y); font-size: 13px; }
.lt-mid small { font-size: 10px; color: var(--L); white-space: nowrap; }
#lcd-banner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6%; gap: 2px; pointer-events: auto; line-height: 1.2; text-align: center; font-family: var(--dot); color: var(--W); animation: bnin .25s steps(3); }
#lcd-banner[hidden] { display: none; }
@keyframes bnin { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
.bn-k { font-size: calc(var(--px) * 4); text-shadow: 2px 0 var(--K), -2px 0 var(--K), 0 2px var(--K), 0 -2px var(--K); }
.bn-t { font-size: calc(var(--px) * 12); color: var(--Y); letter-spacing: .04em; text-shadow: 3px 0 var(--K), -3px 0 var(--K), 0 3px var(--K), 0 -3px var(--K), 3px 3px var(--K), -3px 3px var(--K), 3px -3px var(--K), -3px -3px var(--K); }
.bn-s { font-size: calc(var(--px) * 4.4); max-width: 94%; padding: 2px 6px; background: var(--K); }
#lcd-banner.k-injury .bn-t, #lcd-banner.k-retire .bn-t { color: var(--W); }
#lcd-banner.k-stamp { justify-content: center; padding: 0; }
#lcd-banner.k-stamp .bn-t { font-size: calc(var(--px) * 14); transform: rotate(-8deg); padding: 0 .2em; border: var(--px) solid currentColor; text-shadow: none; background: var(--W); }
#lcd-banner.k-stamp.ok .bn-t { color: var(--e); }
#lcd-banner.k-stamp.ng .bn-t { color: var(--R); }
body.dimmed #lcd { filter: grayscale(1) brightness(.55); }
body.dimmed .bezel { background: var(--K); }
body.dimmed #stage { color: var(--muted); }

/* 能力：ドットのアイコン＋目盛り */
#statsbar { width: 100%; max-width: 440px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px 8px; margin-top: 8px; cursor: pointer; }
.sb { display: grid; grid-template-columns: 14px 1fr auto; gap: 3px; align-items: center; min-width: 0; font-family: var(--dot); font-size: 11px; line-height: 14px; }
.sb-i { width: 14px; height: 14px; }
.sb-t { height: 6px; border: 1px solid var(--ink); background: var(--soft-line); position: relative; overflow: hidden; }
.sb-t i { position: absolute; inset: 0 auto 0 0; background: var(--ink); background-image: repeating-linear-gradient(90deg, transparent 0 3px, var(--bg) 3px 4px); }
.sb.warn .sb-t i { background-color: var(--R); }
.sb.warn .sb-n { color: var(--accent-text); }
.sb-n { min-width: 1.6em; text-align: right; font-variant-numeric: tabular-nums; }
.sb[hidden], .sb.money[hidden] { display: none !important; }
.sb.money { grid-column: auto; display: block; text-align: right; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.battle #statsbar, body.battle #peerbar { display: none; }
.peerbar { display: flex; gap: 8px; align-items: center; width: 100%; max-width: 440px; margin-top: 6px; padding: 3px 8px; min-height: 30px; border: 2px dashed var(--soft-line); background: transparent; color: var(--ink); font-size: 13px; text-align: left; cursor: pointer; }
.peerbar[hidden] { display: none; }
.peerbar b { flex: none; font-family: var(--dot); font-weight: 400; color: var(--accent-text); font-size: 12px; }
#peer-news { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 物語（2〜3行） ---------- */
#stagewrap { flex: 1; min-height: 64px; display: flex; flex-direction: column; position: relative; }
#stagewrap[hidden] { display: none; }
#stage { flex: 1; min-height: 0; overflow-y: auto; padding-block: 8px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); cursor: pointer; }
#log { display: flex; flex-direction: column; gap: 6px; min-height: 100%; justify-content: flex-end; }
.ln { margin: 0; line-height: 1.6; font-size: 16px; animation: fade .2s steps(2); overflow-wrap: anywhere; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.ln.chosen { color: var(--accent-text); font-weight: 700; font-size: 15px; }
.ln.chosen.auto { color: var(--muted); }
.ln.delta { font-size: 14px; font-weight: 700; color: var(--accent-text); }
.ln.year { display: flex; align-items: baseline; gap: 10px; font-family: var(--dot); font-size: 14px; color: var(--muted); border-bottom: 2px solid var(--soft-line); padding-bottom: 2px; }
.ln.year b { font-weight: 400; font-size: 22px; color: var(--ink); line-height: 1.1; }
.ln.peer { font-size: 14px; color: var(--muted); border-left: 4px solid var(--accent); padding-left: 8px; }
.ln.corner { font-size: 14px; color: var(--accent-text); }
.ln.quiet { color: var(--muted); }
.ln.epitaph { font-family: var(--dot); font-size: 20px; line-height: 1.5; text-align: center; padding: 8px 0; }
.ln.scale-ln { font-family: var(--dot); font-size: 15px; display: flex; gap: 10px; align-items: center; }
.stamp { font-family: var(--dot); font-size: 16px; padding: 0 8px; border: 2px solid currentColor; transform: rotate(-6deg); }
.stamp.ok { color: var(--good); }
.stamp.ng { color: var(--accent-text); }
.dchip { display: block; width: fit-content; max-width: 100%; margin-top: 2px; font-family: var(--dot); font-size: 12px; line-height: 1.5; color: var(--accent-text); padding: 0 6px; border: 1px solid var(--accent); }
.chapter { margin: auto 0; padding: 6px 0; border-top: 4px solid var(--accent); }
.ch-sub { color: var(--muted); font-family: var(--dot); font-size: 13px; }
.ch-title { font-family: var(--dot); font-weight: 400; font-size: clamp(22px, 7vw, 30px); line-height: 1.25; margin: 4px 0 0; text-wrap: balance; }
.chapter.ms { border-top-color: var(--ink); }
.chapter.ms .ch-title { font-size: clamp(34px, 11vw, 48px); line-height: 1.1; }
.announce { font-family: var(--dot); font-size: clamp(20px, 6vw, 26px); line-height: 1.35; margin: 0; text-align: center; text-wrap: balance; }
.ln[class*="f-"] { font-size: 15px; line-height: 1.55; }
.ln.f-hit.by-me, .ln.f-hitbig.by-me { color: var(--accent-text); }
.ln.f-hit.by-op, .ln.f-hitbig.by-op { color: var(--B); }
.ln.f-big, .ln.f-fin, .ln.f-crit { font-family: var(--dot); font-size: 18px; }
.ln.f-big.by-me, .ln.f-fin.by-me, .ln.f-crit.by-me { color: var(--accent-text); }
.ln.f-big.by-op, .ln.f-fin.by-op, .ln.f-crit.by-op { color: var(--B); }
.ln.f-kai { color: var(--muted); font-size: 14px; }
.ln.f-gong { font-family: var(--dot); color: var(--ink); }
.ln.f-warn { color: var(--O); font-weight: 700; }
.ln.f-sub { font-weight: 700; }
:root[data-theme="dark"] .ln.f-hit.by-op, :root[data-theme="dark"] .ln.f-hitbig.by-op, :root[data-theme="dark"] .ln.f-big.by-op, :root[data-theme="dark"] .ln.f-fin.by-op, :root[data-theme="dark"] .ln.f-crit.by-op { color: var(--C); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ln.f-hit.by-op, :root:not([data-theme="light"]) .ln.f-hitbig.by-op, :root:not([data-theme="light"]) .ln.f-big.by-op, :root:not([data-theme="light"]) .ln.f-fin.by-op, :root:not([data-theme="light"]) .ln.f-crit.by-op { color: var(--C); } }
body.paused #stage { opacity: .6; }

/* ---------- 選択肢 ---------- */
#dock { flex: none; padding-block: 6px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--bg); border-top: 2px solid var(--soft-line); }
#dock[hidden] { display: none; }
#dock { max-height: 62%; overflow-y: auto; overscroll-behavior: contain; }
#choices { display: grid; gap: 6px; }
#choices[hidden] { display: none; }
.choice { display: flex; flex-direction: column; justify-content: center; gap: 1px; width: 100%; min-height: 48px; text-align: left; padding: 6px 12px 6px 28px; border: 2px solid var(--line); border-radius: 0; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 16px; font-weight: 700; text-decoration: none; position: relative; box-shadow: 3px 3px 0 var(--line); }
.choice::before { content: "▶"; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--accent-text); opacity: 0; }
.choice:hover:not([disabled])::before, .choice:focus-visible::before, .choice.auto-pick::before { opacity: 1; }
.choice:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
.choice.primary { background: var(--accent); color: var(--W); }
.choice.primary::before { color: var(--W); }
.choice.more { min-height: 44px; color: var(--muted); font-weight: 500; background: transparent; box-shadow: none; border-style: dashed; border-color: var(--soft-line); }
.choice.sound.on { color: var(--good); border-color: var(--good); }
.c-label { font-size: 16px; line-height: 1.35; }
.c-sub { font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.35; }
.choice.primary .c-sub { color: inherit; opacity: .9; }
.choice.auto-pick { border-color: var(--accent); }
.choice.auto-pick::after { content: "オートが選択中…（タップで変更）"; font-family: var(--dot); font-size: 11px; font-weight: 400; color: var(--accent-text); }
#tapnext { width: 100%; min-height: 44px; border: 0; background: transparent; color: var(--muted); font-family: var(--dot); font-size: 14px; cursor: pointer; animation: blink 1s steps(2) infinite; }
#tapnext[hidden] { display: none; }
#tapnext.flow { animation: none; font-size: 12px; min-height: 36px; }
body.paused #tapnext { color: var(--accent-text); }
@keyframes blink { 50% { opacity: .35; } }
.in-label { font-family: var(--dot); font-size: 14px; color: var(--muted); }
.in-row { display: flex; gap: 6px; }
.in-row input { flex: 1; min-width: 0; min-height: 48px; border: 2px solid var(--line); border-radius: 0; background: var(--surface); padding: 0 12px; font-size: 16px; }
.in-go { flex: none; min-width: 72px; min-height: 48px; border: 2px solid var(--line); border-radius: 0; background: var(--accent); color: var(--W); font-family: var(--dot); cursor: pointer; }

/* ---------- 枠つきの窓（メッセージ・コマンド） ---------- */
.win { position: relative; background: var(--K); color: var(--W); border: 3px solid var(--W); outline: 3px solid var(--K); margin: 3px; }
:root[data-theme="dark"] .win { outline-color: var(--G); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .win { outline-color: var(--G); } }

#battle { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
#battle[hidden] { display: none; }
.bt-stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 10px; flex: none; }
.bt-side { min-width: 0; display: grid; gap: 2px; }
.bt-name { font-family: var(--dot); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt-side.me .bt-name::before { content: "■ "; color: var(--R); }
.bt-side.op .bt-name::before { content: "■ "; color: var(--B); }
.bt-g { display: grid; grid-template-columns: 2.6em 1fr; gap: 4px; align-items: center; font-family: var(--dot); font-size: 11px; line-height: 1.2; }
.bt-gl { color: var(--L); }
.bt-gt { height: 7px; border: 1px solid var(--L); background: var(--D); position: relative; overflow: hidden; }
.bt-gt i { position: absolute; inset: 0 auto 0 0; background: var(--E); background-image: repeating-linear-gradient(90deg, transparent 0 4px, var(--K) 4px 5px); transition: width .3s steps(4); }
.bt-g.st .bt-gt i { background-color: var(--C); }
.bt-g.dm .bt-gt i { background-color: var(--O); }
.bt-gt i.low { background-color: var(--R); }
.bt-g.dm .bt-gt i.low { background-color: var(--O); }
.bt-msg { flex: none; height: calc(3 * 1.55em + 14px); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 12px; font-size: 15px; line-height: 1.55; cursor: pointer; }
.bt-ln { margin: 0; overflow-wrap: anywhere; }
.bt-ln:not(:last-child) { color: var(--L); }
.bt-ln.f-crit, .bt-ln.f-big, .bt-ln.f-fin { font-family: var(--dot); color: var(--Y); }
.bt-ln.f-kai, .bt-ln.f-corner { color: var(--C); }
.bt-cmds { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; padding: 8px; }
.bt-cmds:empty { display: none; }

function wpick(arr, wf) {
  const ws = arr.map((x) => Math.max(0, wf ? wf(x) : (x.w ?? 1)));
  const tot = sum(ws);
  if (tot <= 0) return arr[0];
  let r = R() * tot;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
const fmtMoney = (man) => {
  man = Math.round(man);
  if (Math.abs(man) >= 10000) return (man / 10000).toFixed(man % 10000 === 0 ? 0 : 1) + '億円';
  return man + '万円';
};

/* 無名の対戦相手を作る（名簿が尽きた時の補充用） */
function genericFighter(tier) {
  const base = [38, 50, 62, 76][tier - 1] || 40;
  const st = pick(['striker', 'wrestler', 'grappler', 'allround', 'brawler', 'kick', 'counter']);
  const sv = () => clamp(base + ri(-8, 8), 15, 95);
  const s = [sv(), sv(), sv(), sv(), sv(), sv()];
  if (st === 'striker' || st === 'kick' || st === 'brawler') s[0] += 8;
  if (st === 'wrestler') s[1] += 8;
  if (st === 'grappler') s[2] += 8;
  const foreign = tier >= 3 && chance(0.5);
  const n = foreign ? pick(['ラファエル・', 'アンドレ・', 'マイク・', 'セルゲイ・', 'アリ・', 'チョン・', 'ルイス・']) + pick(['シウバ', 'ジョンソン', 'ペレイラ', 'イワノフ', 'ハサノフ', 'パク', 'ロドリゲス'])
    : pick(SURNAMES) + ' ' + pick(GIVEN);
  return {
    id: 'g' + Math.floor(R() * 1e9), n, nk: pick(['"新鋭"', '"叩き上げ"', '"代打の男"', '"無名の刺客"', '"ダークホース"']), from: foreign ? '海外' : '日本', st, t: tier, s,
    q: pick(['チャンスをもらえて嬉しいです', '勝ちに来ました', 'ジャイアントキリング、見せます']),
    ent: '静かに入場', tt: ['失うものは何もない', 'ここで名前を売ります'], mic: '名前、覚えて帰ってください！', pop: ri(3, 20), generic: true,
  };
}

/* ===== オート：能力・性格・状況から選択肢を選ぶ ===== */
function persona() {
  const k = P.personality.k;
  return {
    bold: ['hatenko', 'chorai'].includes(k) ? 1 : k === 'makezu' ? 0.6 : 0,
    safe: ['majime', 'okubyo'].includes(k) ? 1 : k === 'cool' ? 0.6 : 0,
  };
}
/* 能力変化の"ありがたさ"を数値化 */
function fxValue(fx) {
  if (!fx) return 0;
  const ps = persona();
  const lows = ['str', 'wre', 'grp'].sort((a, b) => P.s[a] - P.s[b]);
  let v = 0;
  for (const k in fx) {
    const d = fx[k];
    if (['str', 'wre', 'grp'].includes(k)) v += d * (k === lows[0] ? 1.3 : 1) * (P.s[k] > 85 ? 0.4 : 1);
    else if (k === 'sta' || k === 'chin') v += d * 0.85;
    else if (k === 'men') v += d * 0.6;
    else if (k === 'cut') v += d * 0.5;
    else if (k === 'pop') v += d * (0.35 + ps.bold * 0.6 + (hasTal('star') ? 0.3 : 0));
    else if (k === 'inj') v -= d * (0.8 + ps.safe * 0.4 + P.s.inj / 120);
    else if (k === 'health') v -= d * 1.2;
    else if (k === 'money') v += d * (P.money < 30 ? 0.08 : 0.025);
    else if (k === 'trust') v += d * (0.15 + ps.safe * 0.2);
    else if (k === 'fol') v += d / 9000;
  }
  return v;
}
function choiceValue(c) {
  if (!c) return 0;
  if (typeof c.ai === 'number') return c.ai;
  if (c.roll) {
    const p = clamp(typeof c.roll.p === 'function' ? c.roll.p(P) : c.roll.p, 0, 1);
    const ps = persona();
    const risk = 0.15 * (ps.bold - ps.safe); // 大胆な性格は賭けに出る
    return (p + risk) * fxValue(c.roll.ok && c.roll.ok.fx) + (1 - p - risk) * fxValue(c.roll.ng && c.roll.ng.fx) + 0.8;
  }
  return fxValue(c.fx) + (c.fn ? 1 : 0) + (c.set ? 0.6 : 0);
}
function argmax(arr, f) { let bi = 0, bv = -Infinity; arr.forEach((x, i) => { const v = f(x, i); if (v > bv) { bv = v; bi = i; } }); return bi; }

function autoChoose(opts, meta = {}) {
  const ok = (i) => opts[i] && !opts[i].disabled;
  const ps = persona();
  const noise = () => rf(-1.2, 1.2);
  const lab = (i) => opts[i].label || '';
  let i;
  switch (meta.kind) {
    case 'tactic': i = autoTactic(meta.fs); break;
    case 'offer': {
      const bs = meta.bouts || [];
      if (P.s.inj >= 70 && opts.length > bs.length) { i = opts.length - 1; break; }
      i = argmax(bs, (b) => (b.title ? 50 : 0) + (b.gp ? 40 : 0) + (b.roadBout ? 35 : 0) + (b.peer ? 8 + ps.bold * 6 : 0)
        + (b.move ? (P.lstreak >= 2 ? -5 : 12 + ps.bold * 5 - (b.short ? 8 * ps.safe : 0)) : 5) + (b.nye ? 10 : 0) + b.pay / 60 + noise());
      break;
    }
    case 'class': {
      const target = 0.07 + ps.bold * 0.02 - ps.safe * 0.02;
      i = argmax(opts, (o) => -Math.abs((o.pct || 0) / 100 - target));
      break;
    }
    case 'cutmode': i = 0; break;
    case 'fightmode': i = meta.big ? 0 : 1; break;
    case 'battlemode': i = 1; break;
    case 'training': {
      if (P.s.inj >= 55) { i = opts.length - 1; break; }
      const pool = meta.pool || [];
      i = argmax(pool, (t) => t.fx.reduce((a, k) => a + (100 - P.s[k]), 0) / t.fx.length + noise() * 8);
      break;
    }
    case 'retire': {
      const quit = P.age >= 37 || (lifeRetirePull() && P.age >= 33 && P.lstreak >= 1) || P.lstreak >= 4 || P.s.inj >= 88 || P.health >= 85 || (P.age >= 34 && P.lstreak >= 2);
      i = quit ? 1 : 0;
      break;
    }
    case 'gp': i = P.rank != null && P.rank <= 3 || ps.bold ? 0 : 1; break;
    case 'mic': {
      const pref = ps.bold ? ['call', 'trash', 'nye', 'propose', 'humble'] : ps.safe ? ['propose', 'humble', 'nye', 'call', 'trash'] : ['propose', 'call', 'nye', 'humble', 'trash'];
      i = argmax(opts, (o) => -pref.indexOf(o.k) + noise() * 0.6);
      break;
    }
    case 'path': {
      const want = (P.flags.wrestleHS || P.flags.interhigh) && opts.some((o) => o.k === 'univ') ? 'univ' : P.life && P.life.study.g >= 62 && opts.some((o) => o.k === 'college') && (ps.safe || chance(0.5)) ? 'college' : (P.flags.kickAmaChamp || P.flags.muaythai) ? 'kick' : P.money < 10 && ps.safe ? 'local' : 'gym';
      i = Math.max(0, opts.findIndex((o) => o.k === want));
      break;
    }
    case 'career': i = argmax(opts, (o) => ({ gym: 3, tv: 4, yt: 2 + ps.bold * 3, coach: 2, actor: 2 + ps.bold * 2, producer: 2, home: 1 + ps.safe, work: 1 + ps.safe, teacher: 1.8 + ps.safe, trainer: 2.2 }[o.k] || 1) + noise()); break;
    case 'milestone': i = ri(0, opts.length - 1); break;
    case 'recover': i = ps.bold && chance(0.3) ? 1 : 0; break;
    case 'press': i = opts.findIndex((o) => o.k === 'proof'); if (i < 0) i = ps.bold ? 1 : 0; break;
    default:
      if (opts.some((o) => o.data)) i = argmax(opts, (o) => (o.disabled ? -999 : choiceValue(o.data) + noise()));
      else i = argmax(opts, (o, j) => (o.disabled ? -999 : (/見送|断る|やめ|しない/.test(lab(j)) ? -0.5 : 0) + noise()));
  }
  if (!ok(i)) i = opts.findIndex((o) => !o.disabled);
  return Math.max(0, i);
}

/* 試合の作戦：相手との能力差と性格で選ぶ */
function autoTactic(fs) {
  const me = fs.me, op = fs.op;
  const ps = persona();
  const keys = ['strike', 'td', 'counter', 'wall', 'pull', 'pace'];
  if (me.st < 28 && chance(0.5)) return keys.indexOf('pace');
  const s = scoreTotals(fs);
  const behind = fs.rs.length && s.me < s.op - 3 && fs.round >= fs.rounds;
  const e = {
    strike: ef(me, 'str') - ef(op, 'str') + ps.bold * 4 + (behind ? 6 : 0) + (op.hp < 45 ? 8 : 0),
    td: ef(me, 'wre') - ef(op, 'wre') + 2 + (op.st < 40 ? 4 : 0),
    pull: ef(me, 'grp') - ef(op, 'grp') - 7 - (fs.rule === 'rizen' || fs.rule === 'prize' ? 3 : 0),
    counter: ef(me, 'str') - ef(op, 'str') - 3 + (['brawler', 'striker'].includes(op.style) ? 5 : 0) + (me.eye ? 5 : 0) - (behind ? 10 : 0),
    wall: (ef(me, 'wre') - ef(op, 'wre')) * 0.6 + (me.st > op.st + 10 ? 4 : 0) - 2,
  };
  const best = Object.keys(e).sort((a, b) => e[b] - e[a] + rf(-2, 2))[0];
  return keys.indexOf(best);
}

/* ===== 同期：同じ年にデビューした架空のファイターたち ===== */
const PEER_STYLES = ['striker', 'wrestler', 'grappler', 'kick', 'brawler', 'allround', 'counter', 'bjj'];
const TIER_LEVEL = [30, 46, 60, 72, 84];

function genPeers() {
  const peers = [];
  const myAvg = avgStats();
  const n = ri(3, 4);
  const mk = (name, st, rival) => {
    const s = [0, 1, 2, 3, 4, 5].map(() => clamp(Math.round(myAvg + ri(-9, 7)), 18, 80));
    if (['striker', 'kick', 'brawler', 'counter'].includes(st)) s[0] += 8;
    if (st === 'wrestler') s[1] += 8;
    if (st === 'grappler' || st === 'bjj') s[2] += 8;
    return {
      id: 'peer' + peers.length, n: name, st, s, g: rf(0.65, 1.35), off: ri(-2, 2), rival: !!rival,
      org: chance(0.25) ? 'shura' : 'local', rank: null, champ: false, rec: { w: 0, l: 0 }, streak: 0, lst: 0,
      status: 'active', injOut: 0, titles: [], peak: 0, retAge: null, career: null, deathAge: null, pop: ri(3, 25), vsMe: { w: 0, l: 0 },
    };
  };
  if (P.rival) peers.push(mk(P.rivalName, 'striker', true));
  while (peers.length < n) {
    const foreign = chance(0.2);
    const name = foreign ? pick(['ジョアン・', 'ケビン・', 'アンドレイ・', 'ジョシュ・']) + pick(['タナカ', 'ヤマモト', 'イシイ', 'ミヤザキ']) : pick(SURNAMES) + ' ' + pick(GIVEN);
    if (name === fullName() || peers.some((p) => p.n === name)) continue;
    peers.push(mk(name, pick(PEER_STYLES)));
  }
  P.peers = peers;
  P.peerNews = [];
  pushPeerNews('同期デビュー：' + peers.map((p) => shortName(p.n)).join('、') + '。同じ年にプロになったライバルたちだ。');
}
function avgStats(p = P) { return (p.s.str + p.s.wre + p.s.grp + p.s.sta + p.s.chin + p.s.men) / 6; }
function peerAge(pe) { return P.age + pe.off; }
function peerAvg(pe) { return sum(pe.s) / 6; }
function pushPeerNews(t) { P.peerNews = P.peerNews || []; P.peerNews.unshift({ y: curYear(), t }); P.peerNews = P.peerNews.slice(0, 14); }

/* 1年分を進める。戻り値はその年の目立つニュース（表示用） */
function simPeersYear() {
  if (!P.peers) return [];
  const news = [];
  const y = curYear();
  for (const pe of P.peers) {
    const age = peerAge(pe);
    const nm = shortName(pe.n);
    if (pe.status === 'dead') continue;
    if (pe.status === 'retired') {
      const pd = deathProb(age, 0);
      if (chance(pd)) { pe.status = 'dead'; pe.deathAge = age; news.push('同期の' + nm + 'が亡くなった。享年' + age + '。'); }
      continue;
    }
    if (!orgOpen(pe.org, y)) { pe.org = tierOf(pe.org) >= 3 ? majorOrg(y) : 'shura'; pe.rank = null; pe.champ = false; }
    // 成長と衰え
    pe.s = pe.s.map((v) => clamp(v + (age <= 27 ? pe.g * rf(1.2, 3.4) : age <= 31 ? pe.g * rf(0, 1.4) : -rf(0.5, 2.2)), 15, 93));
    if (pe.injOut > 0) { pe.injOut--; continue; }
    let yearNews = null;
    const fights = ri(1, 3);
    for (let i = 0; i < fights; i++) {
      const t = tierOf(pe.org);
      const title = (pe.rank != null && pe.rank <= 1 && pe.streak >= 2) || (pe.champ && chance(0.6));
      const opp = TIER_LEVEL[t] + (title ? 7 : 0) + rf(-6, 6);
      const p = 1 / (1 + Math.exp(-(peerAvg(pe) - opp) / 5.5));
      if (chance(p)) {
        pe.rec.w++; pe.streak++; pe.lst = 0;
        if (title && !pe.champ) { pe.champ = true; pe.rank = 0; pe.titles.push(orgBelt(pe.org) + '（' + y + '）'); yearNews = nm + 'が' + orgBelt(pe.org) + 'を獲得！'; }
        else if (!pe.champ) pe.rank = pe.rank == null ? 9 : Math.max(1, pe.rank - ri(1, 3));
      } else {
        pe.rec.l++; pe.lst++; pe.streak = 0;
        if (pe.champ && title) { pe.champ = false; pe.rank = 3; yearNews = nm + 'が王座から陥落。'; }
        else if (pe.rank != null) { pe.rank += 3; if (pe.rank > 10) pe.rank = null; }
      }
      pe.peak = Math.max(pe.peak, t * 20 + (pe.champ ? 15 : pe.rank != null ? 11 - pe.rank : 0));
    }
    // 昇格
    const t = tierOf(pe.org);
    const up = t <= 1 && pe.rec.w >= 3 ? pick(['shura', 'pancrush', orgOpen('dive', y) ? 'dive' : 'shura'])
      : t === 2 && ((pe.rank != null && pe.rank <= 2) || pe.champ) && pe.rec.w >= 6 ? majorOrg(y)
        : t === 3 && pe.champ && pe.rec.w >= 11 && chance(0.4) ? 'ufx' : null;
    if (up && orgOpen(up, y) && up !== pe.org) { pe.org = up; pe.rank = null; pe.champ = false; yearNews = yearNews || nm + 'が' + orgName(up) + '参戦を発表。'; }
    if (chance(0.1)) { pe.injOut = 1; yearNews = yearNews || nm + 'が大ケガで長期欠場。'; }
    // 引退
    if ((age >= 33 && chance((age - 32) * 0.13)) || (pe.lst >= 4 && chance(0.5)) || age >= 41) {
      pe.status = 'retired'; pe.retAge = age;
      pe.career = pick(['ジム経営', '指導者', '解説者', '会社員', '家業を継ぐ', 'YouTuber', '飲食店経営']);
      yearNews = nm + 'が引退（' + pe.rec.w + '勝' + pe.rec.l + '敗）。今後は' + pe.career + 'に。';
    }
    if (!yearNews && chance(0.25)) yearNews = nm + 'は' + orgName(pe.org) + 'で' + pe.rec.w + '勝' + pe.rec.l + '敗。' + (pe.streak >= 3 ? pe.streak + '連勝中。' : pe.lst >= 2 ? '連敗が続いている。' : '');
    if (yearNews) news.push(yearNews);
  }
  news.forEach(pushPeerNews);
  return news;
}
function peerStatusText(pe) {

  if (pe.status === 'retired') return '引退・' + pe.career;

function deathProb(age, health) {
  const base = age < 50 ? 0.0015 : age < 60 ? 0.004 : age < 70 ? 0.012 : age < 80 ? 0.035 : age < 90 ? 0.09 : 0.22;
  return base * (1 + health / 90);
}

/* ---- 試合結果の記録（本戦とその他の試合で共通） ---- */
function recordResult(b, res, nc) {
  const o = oppOf(b);
  const rec = P.rec;
  const m = res.method;
  const isFinish = m === 'KO' || m === 'TKO' || m === '一本';
  P.bouts++;
  if (nc) rec.nc++;
  else if (res.win) { rec.w++; if (m === '一本') rec.sub++; else if (isFinish) rec.ko++; else rec.dec++; }
  else if (res.loss) { rec.l++; if (m === '一本') rec.lsub++; else if (isFinish) rec.lko++; else rec.ldec++; }
  else rec.d++;
  const mk = nc ? 'NC' : res.win ? '○' : res.loss ? '×' : '△';
  if (res.win) mark('w'); else if (res.loss) mark('l');
  if (!b.quick) chron(mk + ' vs ' + o.n + '（' + (m === '判定' ? res.detail + '判定' : m) + '）' + b.event, res.win ? 'w' : 'l');
  P.history.push({ mark: mk, opp: o.n, oppNick: o.nk, method: m === '判定' ? res.detail + '判定' : m + '・' + res.detail, r: res.round, t: res.time, ev: b.event, org: b.org, age: P.age, year: curYear(), title: !!b.title || b.gp === 'final', nye: !!b.nye, excite: (res.excite || 10) + (o.pop || 0) / 4, quick: !!b.quick });
  if (!nc && !b.quick) rankAfter(b, res);
  else if (b.quick) { // その他の試合はランキングへの影響が小さい
    if (res.win && P.rank != null && P.rank > 3) P.rank--;
    if (res.loss) { P.streak = 0; P.lstreak++; if (P.rank != null) { P.rank += 1; if (P.rank > 10) P.rank = null; } }
    if (res.win) P.lstreak = 0;
  }
  if (o.peer) peerResultAfterBout(b, res);
  return isFinish;
}

/* その年のほかの試合（1行で結果だけ） */
async function quickBout() {
  const b = makeBout(P.org, { quick: true });
  P.used[b.opp] = 1;
  const o = oppOf(b);
  b.cond = 1;
  const fs = newFs(b);
  while (!fs.over && fs.round <= fs.rounds) {
    simRound(fs, ['strike', 'td', 'counter', 'wall', 'pull', 'pace'][autoTactic(fs)], aiTactic(fs));
    if (fs.over) break;
    [fs.me, fs.op].forEach((F) => { F.st = clamp(F.st + 18 + F.sta / 6, 0, 100); F.hp = clamp(F.hp + 3 + F.men / 40, -50, 100); });
    fs.round++;
  }
  let res;
  if (fs.over) res = { win: fs.res.winner === 'me', loss: fs.res.winner === 'op', method: fs.res.method, detail: fs.res.detail, round: fs.res.round, time: fs.res.time };
  else { fs.round = fs.rounds; const d = decide(fs, b); res = { win: d.winner === 'me', loss: d.winner === 'op', draw: !d.winner, method: '判定', detail: d.kind, round: fs.rounds, time: fs.min * 60 }; }
  res.excite = 8;
  const fin = recordResult(b, res, false);
  const pay = Math.round(b.pay * (res.win ? 1 : 0.7));
  const dmg = 100 - Math.max(fs.me.hp, -20);
  const xp = res.win ? 0.4 : 0.2;
  const d = applyFx({ money: pay, inj: Math.max(1, dmg / 8), pop: res.win ? (fin ? 3 : 1) : -1, str: xp, wre: xp, grp: xp, fol: res.win ? Math.round([200, 800, 2500, 12000, 30000][tierOf(b.org)] * (fin ? 1 : 0.4)) : 0 });
  const mk = res.win ? '○' : res.loss ? '×' : '△';
  await UI.say([pick(['春', '初夏', '秋口']) + '、' + b.event + 'で' + o.n + 'と対戦。' + mk + ' ' + (res.method === '判定' ? res.detail + '判定' : res.round + 'R ' + res.method + '（' + res.detail + '）') + '。（通算' + P.rec.w + '勝' + P.rec.l + '敗）']);
  await UI.delta(deltaLine(d));
  if (res.loss && fin && (res.method !== '一本') && chance(0.3)) { P.noMainThisYear = true; await UI.say(['KO負けによる出場停止で、この年の残りの試合には出られなくなった。']); }
}

function newFriend(how) {
  const L = lifeOf();
  let n; do { n = pick(SURNAMES) + ' ' + pick(GIVEN); } while (n === fullName() || n === P.rivalName || L.friends.some((f) => f.n === n));
  const fr = { n, how, off: ri(-1, 1), hair: pick(['short', 'buzz', 'spiky', 'pomp', 'short']), hairC: pick(['H', 'H', 's']), c: pick(['B', 'E', 'G', 'O']), glasses: chance(0.4), beard: chance(0.3), job: null, met: P.age, mem: [] };
  L.friends.push(fr);
  mark('friend'); chron(fr.n + 'と友だちになった。', 'friend');
  return fr;
}

async function lifeBeat(p) {

  const L = lifeOf();

  const due = BEATS.filter((b) => b.due && can(b));

    const pool = BEATS.filter((b) => !b.due && can(b));

}

/* --- 1ラウンド分のシミュレーター（オート観戦とコマンドバトルで共通） --- */
function mkSim(fs, tMe, tOp, nTicks) {
  const R0 = RULES[fs.rule];

  const T = { me: tMe, op: tOp };
  const other = (w) => (w === 'me' ? 'op' : 'me');
  let tick = 0;
  const S = { ev, sc, F, T, R0, rmin, ticks, crit: false };
  const line = (cat, a, d, kind) => {
    const arr = CM[cat];
    if (!arr) return;
    const t = pick(arr).replace(/\{A\}/g, F[a] ? F[a].nm : '').replace(/\{D\}/g, F[d] ? F[d].nm : '');
    ev.push({ t, k: kind || 'n', who: a, cat, hp: [F.me.hp, F.op.hp], st: [F.me.st, F.op.st], pos: posLabel(fs), p: { ...fs.pos } });
  };

  const finish = (winner, method, detail, cat) => {
    fs.over = true;
    const secs = Math.min(rmin * 60 - 1, Math.round(((tick + rf(0.15, 0.95)) / ticks) * rmin * 60));
    fs.res = { winner, method, detail, round: fs.round, time: secs };
    if (cat) line(cat, winner, other(winner), 'fin');
    sc[winner].dmg += 10;
  };
  const posLabel = (f) => {
    const p = f.pos;
    if (p.k === 'stand') return 'スタンド';
    if (p.k === 'clinch') return R0.ring ? 'ロープ際' : '金網際';
    if (p.k === 'ali') return '猪木アリ状態';
    const top = F[p.top].nm;
    if (p.back) return top + 'がバック';
    return top + 'が' + ['ガード内', 'ハーフ', 'サイド', 'マウント'][p.lv];
  };
  const hit = (a, d, base, isBig) => {
    const A = F[a], D = F[d];
    let dmg = base * 1.9 * (0.5 + ef(A, 'str') / 85) * rf(0.7, 1.3) * (1.2 - D.chin / 180);
    if (A.fist && isBig) dmg *= 1.2;
    if (D.guard) dmg *= 0.55;
    if (S.crit && A.me && base >= 3 && chance(0.06 + (A.eye ? 0.06 : 0) + (A.fist ? 0.04 : 0) + (D.hp < 50 ? 0.04 : 0))) {
      dmg *= 1.6; ev.push({ t: 'クリーンヒット！ ' + A.nm + 'の一撃が、芯を捉えた！', k: 'crit', who: a, hp: [F.me.hp, F.op.hp], st: [F.me.st, F.op.st] });
    }
    D.hp -= dmg; sc[a].dmg += dmg;
    D.st -= dmg * 0.35;
    return dmg;
  };
  const tryKO = (a, d, dmg, big) => {
    const A = F[a], D = F[d];
    if (fs.over) return true;
    const kdp = big ? clamp((dmg / (D.hp + 22)) * (1.25 - D.chin / 120), 0, 0.7) : 0;
    if (D.hp <= 0 || chance(kdp)) {
      D.kd++; sc[a].kd++; D.hp -= 5;
      line('kd', a, d, 'big'); kai('kai_hurt');
      if (chance(0.5)) line('crowd', a, d, 'crowd');

function aiTactic(fs) {
  const op = fs.op, me = fs.me;

function rScore(s, rule) {

  return { me, op };
}

/* --- 判定 --- */
function decide(fs, b) {
  const r = RULES[fs.rule];
  const pen = (b.minus || 0);
  const yel = fs.yellow;
  const cards = [];
  if (r.judging === 'must') {
    const tot = [0, 0, 0].map(() => ({ me: 0, op: 0 }));
    fs.rs.forEach((rd) => {
      const diff = rScore(rd.me, fs.rule) - rScore(rd.op, fs.rule);
      tot.forEach((t) => {
        let d = diff + rf(-4, 4);
        if (Math.abs(d) < 1) d = chance(0.5) ? 1 : -1;
        const ten8 = Math.abs(d) > 22 || (d > 0 ? rd.me.kd : rd.op.kd) >= 2;
        if (d > 0) { t.me += 10; t.op += ten8 ? 8 : 9; } else { t.op += 10; t.me += ten8 ? 8 : 9; }
      });
    });
    tot.forEach((t) => { t.me -= pen; t.op -= (b.oppMinus || 0); });
    let wm = 0, wo = 0, dr = 0;
    tot.forEach((t) => { if (t.me > t.op) wm++; else if (t.op > t.me) wo++; else dr++; cards.push(t.me + '-' + t.op); });
    let winner = null, kind;
    if (wm >= 2) winner = 'me'; else if (wo >= 2) winner = 'op';
    if (winner) kind = (winner === 'me' ? wm : wo) === 3 ? 'ユナニマス' : (dr ? 'マジョリティ' : 'スプリット');
    else kind = 'ドロー';
    return { winner, kind, cards };
  }
  const s = scoreTotals(fs);
  const me = s.me - pen * 8 - yel.me * 6, op = s.op - yel.op * 6 - (b.oppMinus || 0) * 8;
  let wm = 0;
  for (let i = 0; i < 3; i++) {
    const n = (me + op) * 0.07 + 2;
    const d = me - op + rf(-n, n);
    const w = d === 0 ? chance(0.5) : d > 0;
    if (w) wm++;
    cards.push(w ? fs.me.nm : fs.op.nm);
  }
  const winner = wm >= 2 ? 'me' : 'op';
  const kind = wm === 3 || wm === 0 ? 'ユナニマス' : 'スプリット';
  return { winner, kind, cards };
}

    }
  }
  if (P.fs && P.fs.key === b.event + '|' + b.opp) digest = !!P.fs.digest;
  let fs = P.fs && P.fs.key === b.event + '|' + b.opp ? P.fs : newFs(b);
  fs.digest = digest;
  fs.mode = mode;
  P.fs = fs;
  const o = oppOf(b);
  UI.scene('fight');
  UI.fightOn(fs, b);
  if (!fs.intro) {
    fs.intro = true;
    if (!digest) await entrance(b, o);
  }
  if (fs.mode === 'cmd') await commandBattle(fs, b);
  if (!fs.tactic && digest) {
    UI.note('作戦を決めよう。', 'chosen');
    fs.tactic = await UI.tactic(fs, b);
  }
  while (!fs.over && fs.round <= fs.rounds) {
    fs.rng = RNG.state; P.fs = fs; saveGame();
    let tMe = fs.tactic;
    if (fs.mode === 'watch') { tMe = ['strike', 'td', 'counter', 'wall', 'pull', 'pace'][autoTactic(fs)]; UI.fightHud(fs); }
    else if (!digest) {
      UI.fightHud(fs);
      UI.note((fs.round === fs.rounds && fs.rounds > 1 ? '最終ラウンド' : fs.round + 'R') + '、作戦は？', 'chosen');
      tMe = await UI.tactic(fs, b);
    }
    const tOp = aiTactic(fs);
    if (!digest) await UI.sayFight([{ t: (fs.round === 1 ? '試合開始のゴング！ ' : '') + fs.round + 'R開始。' + fs.op.nm + 'は' + tacticHint(tOp), k: 'gong', sfx: 'bell' }]);
    const ev = simRound(fs, tMe, tOp);
    if (digest) {
      const hl = ev.filter((e) => ['big', 'fin', 'sub', 'td', 'hitbig'].includes(e.k));
      const show = (hl.length ? hl : ev).slice(-4);
      await UI.sayFight([{ t: fs.round + 'R', k: 'gong', sfx: 'bell' }, ...show], { fast: true });
    } else await UI.sayFight(ev);
    UI.fightHud(fs);
    if (fs.over) break;
    // インターバル
    const lastR = fs.round >= fs.rounds;
    if (!digest) await UI.sayFight([{ t: lastR ? '試合終了のゴング！ 判定へ！' : 'ラウンド終了のゴング。', k: 'gong', sfx: 'bell' }]);
    [fs.me, fs.op].forEach((F) => { F.st = clamp(F.st + 18 + F.sta / 6, 0, 100); F.hp = clamp(F.hp + 3 + F.men / 40, -50, 100); });
    if (!lastR && !digest) UI.note(cornerAdvice(fs), 'corner');
    fs.round++;
  }
  // 結果
  let res;
  if (fs.over) {
    const r = fs.res;
    res = { win: r.winner === 'me', loss: r.winner === 'op', method: r.method, detail: r.detail, round: r.round, time: r.time };
    if (r.method === 'KO' || r.method === '一本') { UI.vibe(); }
    AudioSys.sfx(r.winner === 'me' ? 'cheer' : 'groan');
  } else {
    fs.round = fs.rounds;
    const d = decide(fs, b);
    res = { win: d.winner === 'me', loss: d.winner === 'op', draw: !d.winner, method: '判定', detail: d.kind, cards: d.cards, round: fs.rounds, time: fs.min * 60 };
    if (!digest) await UI.say(['（解説）「いや〜、これは' + (Math.abs(scoreTotals(fs).me - scoreTotals(fs).op) < 8 ? '判定、割れるかもしれませんね' : 'はっきりしてるんじゃないですか') + '」']);
  }
  res.yellow = fs.yellow.me;
  res.hpLeft = fs.me.hp; res.oppHpLeft = fs.op.hp;
  res.kdMe = fs.me.kd; res.kdOp = fs.op.kd;
  res.dmgTaken = 100 - Math.max(fs.me.hp, -20);
  res.excite = (res.method === 'KO' || res.method === '一本' ? 30 : res.method === 'TKO' ? 24 : 10) + (fs.me.kd + fs.op.kd) * 8 + (b.title ? 25 : 0) + (b.nye ? 15 : 0) + (b.gp ? 15 : 0) + tierOf(b.org) * 6 + (res.win && fs.me.kd ? 15 : 0);
  res.fsRounds = fs.rs.length;
  return res;
}

/* ===== 自分で戦う：ターン制コマンドバトル（判定・KO・一本のルールは通常の試合と共通） ===== */
const CMD = {

  low: { l: 'ローキック', s: '足を削る', t: 'strike' },

  tackle: { l: 'タックル', s: '倒して上を取る', t: 'td' },
  pull: { l: '寝技に誘う', s: '引き込んで下から勝負', t: 'pull' },
  wait: { l: '様子を見る', s: '息を整え、カウンターを狙う', t: 'counter' },
  guard: { l: 'ガードを固める', s: '被弾を大きく減らす', t: 'pace' },
  knee: { l: 'ヒザ蹴り', s: '組んだままボディへ', t: 'wall' },
  dirty: { l: 'ショートパンチ', s: '密着して細かく', t: 'wall' },
  clinchTD: { l: 'テイクダウン', s: '組みから倒す', t: 'td' },
  breakaway: { l: '離れる', s: 'スタンドに戻す', t: 'pace' },
  reverse: { l: '差し返す', s: '体を入れ替える', t: 'wall' },
  guillotine: { l: 'ギロチンを狙う', s: '首を抱える', t: 'pull' },
  pound: { l: 'パウンド', s: '上から叩く', t: 'td' },
  pass: { l: 'パスガード', s: 'ポジションを上げる', t: 'td' },
  mount: { l: 'マウントを取る', s: '馬乗りになる', t: 'td' },
  back: { l: 'バックを取る', s: '背中に回る', t: 'td' },
  joint: { l: '関節を狙う', s: '腕・肩を極める', t: 'td' },
  choke: { l: 'チョークを狙う', s: '裸絞め', t: 'td' },
  standup: { l: '立ち上がる', s: 'スタンドに戻る', t: 'strike' },
  subBottom: { l: '下から極める', s: '三角・腕十字', t: 'pull' },
  sweep: { l: 'スイープ', s: '下から返す', t: 'pull' },
  escape: { l: '背中から逃げる', s: '向き直る', t: 'pace' },
  upkick: { l: '蹴り上げ', s: '寝たまま蹴る', t: 'pull' },
  legkick: { l: '足を蹴る', s: '寝ている相手の足へ', t: 'strike' },
  stomp: { l: '踏みつけ', s: 'リングならでは', t: 'strike' },
  dive: { l: '飛び込む', s: '上を取りに行く', t: 'td' },
};
function battleCommands(fs) {
  const p = fs.pos, me = fs.me;
  const R0 = RULES[fs.rule];
  if (p.k === 'stand') return ['jab', 'low', 'straight', 'tackle', 'pull', me.hp < 45 ? 'guard' : 'wait'];
  if (p.k === 'clinch') return p.a === 'me' ? ['knee', 'dirty', 'clinchTD', 'breakaway'] : ['reverse', 'knee', 'guillotine', 'breakaway'];
  if (p.k === 'ali') return p.down === 'me' ? ['upkick', 'standup', 'guard'] : (R0.soccer ? ['legkick', 'stomp', 'dive', 'wait'] : ['legkick', 'dive', 'wait']);
  if (p.top === 'me') {
    if (p.back) return ['choke', 'pound', 'standup'];
    return ['pound', p.lv < 2 ? 'pass' : p.lv === 2 ? 'mount' : 'pound', 'back', 'joint', 'standup'].filter((v, i, a) => a.indexOf(v) === i);
  }
  if (p.back) return ['escape', 'guard', 'standup'];
  return ['standup', 'subBottom', 'sweep', 'guard'];
}

/* 自分の1手を解決する */
function doCommand(S, fs, cmd) {
  const F = S.F, me = F.me, op = F.op, p = fs.pos;
  const R0 = S.R0;
  S.T.me = CMD[cmd].t;
  switch (cmd) {
    case 'jab': S.strike('me', 'op', false, 'jab'); break;
    case 'low': S.strike('me', 'op', false, chance(0.45) ? 'calf' : 'low'); break;
    case 'straight': S.strike('me', 'op', false, pick(['onetwo', 'hook', 'onetwo', 'upper', me.eye ? 'counter' : 'hook'])); break;
    case 'tackle': S.takedown('me', 'op', false); break;
    case 'pull': S.doTick('me'); break;
    case 'wait': me.st = Math.min(100, me.st + 10); S.line('feint', 'me', 'op'); me.counter = true; break;
    case 'guard': me.guard = true; me.st = Math.min(100, me.st + 6); S.line('guard', 'me', 'op'); break;
    case 'knee': S.line('clinch_knee', 'me', 'op', 'hit'); S.tryKO('me', 'op', S.hit('me', 'op', chance(0.5 + (ef(me, 'str') - ef(op, 'str')) / 150) ? 4.5 : 0.5, false), false); S.sc.me.ctl += 0.8; break;
    case 'dirty': S.line('clinch_knee', 'me', 'op', 'hit'); S.tryKO('me', 'op', S.hit('me', 'op', 3, false), false); op.st -= 3; S.sc.me.ctl += 0.8; break;
    case 'clinchTD': S.takedown('me', 'op', true); break;
    case 'breakaway': if (chance(0.55 + (ef(me, 'wre') - ef(op, 'wre')) / 120)) { S.line('clinch_break', 'me', 'op'); fs.pos = { k: 'stand' }; } else S.line(R0.ring ? 'clinch_ring' : 'clinch_cage', 'op', 'me'); break;
    case 'reverse': if (chance(0.4 + (ef(me, 'wre') - ef(op, 'wre')) / 100)) { fs.pos = { k: 'clinch', a: 'me' }; S.line(R0.ring ? 'clinch_ring' : 'clinch_cage', 'me', 'op'); } else S.line(R0.ring ? 'clinch_ring' : 'clinch_cage', 'op', 'me'); break;
    case 'guillotine': S.sub('me', 'op', 'guillotine', 0.02); break;
    case 'pound': {
      if (p.k !== 'gnd') { S.strike('me', 'op'); break; }
      S.sc.me.ctl += 1;
      if (!R0.gPound) { S.line('guard', 'op', 'me'); break; }
      const lvm = p.back ? 1.1 : [0.6, 0.85, 1, 1.45][p.lv];
      const el = R0.gElbow && chance(0.35);
      S.line(el ? 'gelbow' : chance(0.3) ? 'tettsui' : 'pound', 'me', 'op', 'hit');
      const dmg = S.hit('me', 'op', (el ? 5 : 3.8) * lvm, false);
      if (op.hp < 28 && chance(0.3 + (28 - op.hp) / 40)) { S.finish('me', 'TKO', 'パウンド（レフェリーストップ）', 'fin_tko'); break; }
      S.tryKO('me', 'op', dmg, false);
      break;
    }
    case 'pass': case 'mount': case 'back': {
      if (p.k !== 'gnd') break;
      S.sc.me.ctl += 1;
      const edge = ef(me, 'grp') - ef(op, 'grp');
      if (chance(0.42 + edge / 140)) {
        if (cmd === 'pass') { p.lv = Math.min(2, p.lv + 1); S.line('pass', 'me', 'op', 'pos'); }
        else if (cmd === 'mount') { p.lv = 3; S.line('mount', 'me', 'op', 'pos'); }
        else { p.back = true; S.line('back', 'me', 'op', 'pos'); }
      } else S.line('guard', 'op', 'me');
      break;
    }
    case 'joint': S.sub('me', 'op', p.lv === 3 ? 'armbar' : p.lv === 2 ? pick(['kata', 'kimura']) : pick(['kimura', 'heel']), p.lv === 3 ? 0.12 : p.lv === 2 ? 0.08 : 0.01); break;
    case 'choke': S.sub('me', 'op', 'rnc', 0.18); break;
    case 'standup':
      if (p.k === 'gnd' && p.top === 'me') { S.line('getup', 'me', 'op'); fs.pos = { k: 'stand' }; }
      else if (p.k === 'ali') { S.line('getup', 'me', 'op'); fs.pos = { k: 'stand' }; }
      else if (chance(0.32 + (ef(me, 'wre') - ef(op, 'wre')) / 130 - (p.lv || 0) * 0.05)) {
        if ((R0.soccer || R0.gKnee) && chance(0.3)) { const c = R0.soccer ? pick(['soccer', 'gknee', 'stomp']) : 'gknee'; S.line(c, 'op', 'me', 'hitbig'); if (S.tryKO('op', 'me', S.hit('op', 'me', c === 'soccer' ? 11 : 7, true), true)) break; }
        S.line(R0.ring ? 'getup' : 'wall_walk', 'me', 'op'); fs.pos = { k: 'stand' };
      } else S.line('guard', 'me', 'op');
      break;
    case 'subBottom': if (p.k === 'gnd') S.sub('me', 'op', pick(['triangle', 'armbar', 'omoplata', 'triangle']), 0.03); break;
    case 'sweep': if (chance(0.25 + (ef(me, 'grp') - ef(op, 'grp')) / 150)) { S.line('sweep', 'me', 'op', 'pos'); fs.pos = { k: 'gnd', top: 'me', lv: 0, back: false }; S.sc.me.agg += 1.5; } else S.line('guard', 'me', 'op'); break;
    case 'escape': if (chance(0.32 + (ef(me, 'grp') - ef(op, 'grp')) / 140)) { p.back = false; p.lv = 1; S.line('guard', 'me', 'op'); } else S.line('guard', 'me', 'op'); break;
    case 'upkick': S.line('upkick', 'me', 'op', 'hit'); S.tryKO('me', 'op', S.hit('me', 'op', chance(0.5) ? 5 : 1, true), true); break;
    case 'legkick': S.line('ali_kick', 'op', 'me'); op.leg += 8; S.hit('me', 'op', 2, false); break;
    case 'stomp': S.line('stomp', 'me', 'op', 'hitbig'); S.tryKO('me', 'op', S.hit('me', 'op', chance(0.55) ? 6 : 1, true), true); break;
    case 'dive': fs.pos = { k: 'gnd', top: 'me', lv: 0, back: false }; S.line('pass', 'me', 'op', 'pos'); break;
  }
  me.st = clamp(me.st, 0, 100); op.st = clamp(op.st, 0, 100);
}

/* オート（テスト・おまかせ用）：今の状況でいちばん良さそうなコマンド */
function autoCommand(fs, cmds) {
  const me = fs.me, op = fs.op;
  const edge = { str: ef(me, 'str') - ef(op, 'str'), wre: ef(me, 'wre') - ef(op, 'wre'), grp: ef(me, 'grp') - ef(op, 'grp') };
  const score = (c) => ({
    jab: 2 + edge.str / 10, low: 2.5 + edge.str / 12 + (op.leg > 30 ? 1 : 0), straight: 1.5 + edge.str / 8 + (op.hp < 50 ? 2 : 0), tackle: 1.5 + edge.wre / 8,
    pull: edge.grp / 10 - 1, wait: me.st < 40 ? 3 : 0.5, guard: me.hp < 40 ? 2.5 : 0, knee: 2, dirty: 1.6, clinchTD: 1.5 + edge.wre / 8, breakaway: edge.str / 10,
    reverse: 1 + edge.wre / 10, guillotine: edge.grp / 8 - 0.5, pound: 3, pass: 2 + edge.grp / 12, mount: 2.6, back: 2 + edge.grp / 12, joint: 1 + edge.grp / 7, choke: 4,
    standup: fs.pos.top === 'me' ? edge.str / 10 - 1 : 2 + (edge.grp < 0 ? 1 : 0), subBottom: edge.grp / 7, sweep: 1 + edge.grp / 10, escape: 3, upkick: 1, legkick: 1.5, stomp: 2, dive: 1 + edge.grp / 10,
  }[c] || 0) + rf(-0.8, 0.8);
  return argmax(cmds, score);
}

async function commandBattle(fs, b) {
  const R0 = RULES[fs.rule];
  UI.battleOpen(fs, b);
  while (!fs.over && fs.round <= fs.rounds) {
    fs.rng = RNG.state; P.fs = fs; saveGame();
    const tOp = aiTactic(fs);
    const rmin = (fs.round === 1 && R0.firstMin) || fs.min;
    const turns = Math.max(2, Math.round(rmin * (fs.rounds >= 5 ? 1 : 1.2)));
    const S = mkSim(fs, 'strike', tOp, turns * 2);
    S.crit = true;
    await UI.battleMsg([{ t: (fs.round === fs.rounds && fs.rounds > 1 ? '最終ラウンド' : fs.round + 'R') + '開始のゴング！ ' + fs.op.nm + 'は' + tacticHint(tOp), k: 'gong', sfx: 'bell' }], fs);
    for (let t = 0; t < turns && !fs.over; t++) {
      UI.battleUpdate(fs, rmin, t / turns);
      const cmds = battleCommands(fs);
      const cmd = await UI.battleCmd(cmds, fs);
      const from = S.ev.length;
      S.setTick(t * 2);
      doCommand(S, fs, cmd);
      if (!fs.over) {
        S.setTick(t * 2 + 1);
        if (fs.me.counter && fs.pos.k === 'stand') { S.T.me = 'counter'; }
        S.doTick('op');
      }
      fs.me.guard = false; fs.me.counter = false;
      await UI.battleMsg(S.ev.slice(from), fs);
    }
    S.endRound();
    UI.battleUpdate(fs, rmin, 1);
    if (fs.over) break;
    const lastR = fs.round >= fs.rounds;
    await UI.battleMsg([{ t: lastR ? '試合終了のゴング！ 判定へ！' : fs.round + 'R終了のゴング。', k: 'gong', sfx: 'bell' }], fs);
    [fs.me, fs.op].forEach((F) => { F.st = clamp(F.st + 18 + F.sta / 6, 0, 100); F.hp = clamp(F.hp + 3 + F.men / 40, -50, 100); });
    fs.pos = { k: 'stand' };
    if (!lastR) await UI.battleMsg([{ t: cornerAdvice(fs), k: 'corner' }], fs);
    fs.round++;
  }
  UI.battleClose();
}

/* ===== 試合決定〜減量〜計量〜リカバリー =====
   ※減量描写はゲーム上の演出です。具体的な方法・数値の手順は扱いません。 */
async function campAndCut(b) {
  UI.scene('train');
  const o = oppOf(b);
  UI.newPage(); UI.note('試合決定　' + b.event, 'chosen');
  if (b.short) await UI.say(SHORT_NOTICE_LINES.map((l) => l.replace('{org}', orgName(b.org))));
  if (b.move && !b.short) await UI.say(['「' + orgName(b.org) + '」から声がかかった。', '新しい舞台だ。']);
  await UI.say(['対戦相手：' + o.n + '　' + o.nk + '（' + o.from + '出身・' + styleJa(o.st) + '）。口癖は「' + o.q + '」。']);
  if (b.rival) {
    P.flags.rivalFought = true;
    await UI.say(['ついに来た。', '幼なじみ、' + P.rivalName + 'との対戦。', '「小学校の時のかけっこ、まだ根に持ってるのか？」と記者会見で笑われた。']);
  }
  if (b.title) await UI.say([P.champ ? '王者として迎える防衛戦。' : 'ついに、ベルトに挑戦する時が来た。', orgBelt(b.org) + '。']);
  if (b.nye) await UI.say(['舞台は大晦日、さいたまメガアリーナ。', '地上波の生中継…ではなく、PPV配信。それでも日本中が見ている。']);
  const pf = PREFIGHT.filter((e) => (!e.if || e.if(P, b)) && e.id !== P.tmp.lastPF);
  if (pf.length && chance(b.nye || b.title ? 0.8 : 0.3)) {
    const e = wpick(pf, (x) => x.w * (x.id === 'pf_card_change' && b.nye ? 6 : 1));
    P.tmp.lastPF = e.id;
    await runPrefight(e, b);
  }
  if (b.cancel) return;
  if (chance(P.tmp.lastPF && pf.length ? 0.22 : 0.35)) await campLife(b);
  else await petCutWalk();
  await weightCut(b);
}
async function runPrefight(e, b) {
  const pre = e.fn ? e.fn(P, b) : null;
  const v = ctxVars(b);
  await UI.say(e.t.map((l) => fmtT(l, v)));
  if (Array.isArray(pre)) await UI.say(pre);
  if (e.ch) {
    const opts = e.ch.filter((c) => !c.if || c.if(P, b));
    const i = await UI.choose(opts.map((c) => ({ label: fmtT(c.l, ctxVars(b)), data: c })), { kind: 'event' });
    await applyChoice(opts[i], b);
  }
}

async function weightCut(b) {
  const org = ORGS[b.org];
  const hydra = org.hydration && curYear() >= 2016;
  const ivBan = org.ivBan && curYear() >= 2015;
  if (b.org === 'breakout') {
    await UI.say(['BREAKOUTの計量は、だいたい同じくらいの体重ならOK。', '計量会場では、なぜか相手陣営と乱闘寸前になった。']);
    b.cond = 1; return;
  }
  AudioSys.bgm('train');
  const L = b.limit;
  const allow = b.org === 'ufx' && !b.title ? 0.45 : 0;
  let w = P.walk + (P.age > 30 ? 0.5 : 0);
  let cond = 100, strain = 0, usedWater = false, lastSauna = false;
  const gap0 = w - L;
  const pct = gap0 / L;
  const skill = 0.82 + P.s.cut / 260;
  UI.cutPanel({ w, L, cond, step: '減量開始' });
  await (gap0 > 0.3 ? UI.ask : UI.say).call(UI, [
    '契約体重' + kg(L) + '、平常体重' + kg(w) + '。' + (gap0 <= 0 ? '体重は余裕だ。' : '落とすのは' + kg(gap0) + '。' + (pct > 0.12 ? '正直、かなり無茶な減量だ。' : pct > 0.08 ? 'きついが、やれない数字ではない。' : 'いつもの減量だ。')),
    hydra ? 'WONでは計量と同時に、尿比重を調べる「ハイドレーションテスト」がある。脱水状態だと不合格になる。' : '',
  ].filter(Boolean));
  if (gap0 <= 0.3) {
    b.cond = 1.02; b.stStart = 100; P.cutHard = 0;
    await UI.say(['ほとんど減量なしで計量をパス。', '体は軽い。最高のコンディションだ。']);
    await scaleScene(Math.min(w, L - 0.2), L, true);
    return;
  }
  let auto = false;
  const autoPick = (opts) => {
    const r = w - L;
    const lab = opts.map((o) => o.label).join();
    if (/栄養士/.test(lab)) return P.money >= 15 ? 0 : 1;
    if (/急ピッチ/.test(lab)) return 0;
    if (/微調整/.test(lab)) return r > 3.4 ? 2 : r > 2.4 ? 1 : 0;
    if (/最後の汗/.test(lab)) return r > 0.75 ? 0 : r > 0.3 ? 1 : 2;
    if (/最後の追い込み/.test(lab)) return 0;
    if (/経口補水/.test(lab)) return 0;
    return 0;
  };
  const pickc = async (opts, meta) => { if (!auto) return UI.choose(opts, meta || { kind: 'cut' }); const i = autoPick(opts); autoLog.push(opts[i].label); return i; };
  const autoLog = [];
  const say = (ls) => (auto ? Promise.resolve() : UI.say(ls));
  const upd = (label, act) => { P.tmp.cutRemain = w - L; UI.cutPanel({ w, L, cond, step: label, strain, act }); };
  P.tmp.cutRemain = w - L;
  const routine = gap0 > 0.3 && pct <= 0.08 && P.bouts >= 1 && !b.title && !b.nye && !b.short;
  if (routine) {
    auto = true;
  } else if (gap0 > 0.3) {
    const pctTxt = pct > 0.12 ? '無謀' : pct > 0.08 ? 'きつい' : pct > 0.04 ? '普通' : '楽';
    const m = await UI.choose([
      { label: 'いつもの減量でいく（おまかせ）', sub: '減量の難しさ：' + pctTxt + '。チームの段取りに任せる' },
      { label: '自分で細かく管理する', sub: '8週間前・ファイトウィーク・前夜の方法を選ぶ' },
    ], { kind: 'cutmode' });
    auto = m === 0;
  }
  // --- 8週間前 ---
  if (!b.short) {
    await say(['試合8週間前。ファイトキャンプが始まる。']);
    const opts = [
      { label: '栄養士をつけて計画的に落とす', sub: '費用15万円／体への負担が少ない', k: 'plan' },
      { label: '練習量を増やして自力で落とす', sub: '負担は中くらい', k: 'train' },
      { label: '炭水化物を抜く自己流ダイエット', sub: 'よく落ちるが、練習の質が下がる', k: 'carb' },
      { label: 'まだ大丈夫。普段通り食べる', sub: 'ツケは後で払うことになる', k: 'none' },
    ];
    const i = await pickc(opts.map((o) => ({ ...o, disabled: o.k === 'plan' && P.money < 15 })));
    const k = opts[i].k;
    const loss = gap0 * { plan: 0.6, train: 0.5, carb: 0.56, none: 0.12 }[k] * skill * rf(0.92, 1.08);
    w -= loss; cond -= { plan: 2, train: 6, carb: 13, none: 0 }[k];
    if (k === 'plan') { P.money -= 15; }
    if (k === 'carb') applyFx({ sta: -1 }, true);
    upd('8週間前', { plan: 'eat', train: 'jumprope', carb: 'eat', none: 'eat' }[k]);
    await say([{ plan: '毎食の写真を栄養士に送る日々。体重は計画通り、きれいに落ちていく。', train: '朝晩2回の練習。体重はじわじわ落ちていく。', carb: '白米が恋しい。スパーで力が入らない。', none: 'カツ丼を食べた。うまい。…大丈夫、まだ8週間ある。' }[k], '体重 ' + kg(w) + '（あと ' + kg(Math.max(0, w - L)) + '）']);
  } else {
    await say(['急遽出場のため、減量期間は2週間しかない。']);
    const i = await pickc([{ label: '急ピッチで食事を絞る', sub: 'よく落ちるが、体はきつい' }, { label: '練習しながら落とせる分だけ落とす', sub: '負担は小さいが、最後が苦しくなる' }]);
    w -= gap0 * (i === 0 ? 0.42 : 0.28) * skill;
    cond -= i === 0 ? 12 : 5;
    upd('2週間前', 'jumprope');
    await say(['体重 ' + kg(w) + '（あと ' + kg(Math.max(0, w - L)) + '）']);
  }
  // --- ファイトウィーク ---
  await say(['試合1週間前。ファイトウィーク。']);
  {
    const r = w - L;
    const opts = [
      { label: '計画通り、微調整だけ', sub: '残りが少ないなら安全', k: 'fine' },
      { label: '塩分を控えて調整（塩抜き）', sub: '負担：中', k: 'salt' },
      { label: '水分を絞る（水抜き）', sub: hydra ? '負担：大／WONでは検査で引っかかる危険' : '負担：大', k: 'water' },
      { label: 'サウナスーツで走り込む', sub: '負担：中〜大／スタミナを削る', k: 'suit' },
    ];
    const i = await pickc(opts);
    const k = opts[i].k;
    const loss = k === 'fine' ? Math.min(r + 0.2, (1.5 + P.s.cut / 45) * skill) : { salt: rf(1.8, 2.8), water: rf(3.0, 4.5), suit: rf(2.0, 3.0) }[k] * skill;
    w -= Math.max(0, loss);
    cond -= { fine: 2, salt: 7, water: 16, suit: 11 }[k];
    strain += { fine: 0, salt: 1, water: 6, suit: 3 }[k];
    if (k === 'water') usedWater = true;
    upd('1週間前', { fine: 'scale', salt: 'eat', water: 'sauna', suit: 'jumprope' }[k]);
    await say([{ fine: '体重計の数字を見ながら、少しずつ食事を減らす。', salt: '味のしない食事。体からむくみが抜けていく感覚。', water: '喉が渇く。唇がひび割れる。夢の中で、ずっと水を飲んでいた。', suit: '真夏のロードワーク。サウナスーツの中は汗の海だ。' }[k], '体重 ' + kg(w) + '（あと ' + kg(Math.max(0, w - L)) + '）']);
  }
  if (await collapseCheck(b, cond, strain)) return;
  // --- 計量前夜 ---
  if (w - L > allow) {
    await say(['計量前夜。あと' + kg(w - L) + '。']);
    const opts = [
      { label: 'サウナと半身浴で最後の汗を出す', sub: '負担：大', k: 'sauna' },
      { label: 'ガムを噛んで、ひたすら唾を吐く', sub: '負担：小／落ちる量も少ない', k: 'gum' },
      { label: 'もう寝る。朝には落ちているはず', sub: '負担なし', k: 'sleep' },
    ];
    const i = await pickc(opts);
    const k = opts[i].k;
    w -= { sauna: rf(1.0, 2.0), gum: rf(0.4, 0.8), sleep: rf(0.3, 0.7) }[k] * skill;
    cond += { sauna: -12, gum: -3, sleep: 3 }[k];
    strain += { sauna: 5, gum: 0, sleep: 0 }[k];
    lastSauna = k === 'sauna';
    upd('前夜', { sauna: 'sauna', gum: 'idle', sleep: 'sleep' }[k]);
    await say([{ sauna: 'サウナの中で、意識が遠のきかける。トレーナーが外から何度も声をかけてくる。', gum: '紙コップに唾を吐き続ける。地味だ。でも、少しずつ落ちる。', sleep: '布団に入った。胃が鳴っている。' }[k]]);
    if (await collapseCheck(b, cond, strain)) return;
  }
  if (auto) UI.note('チームの段取りどおりに減量（' + autoLog.slice(1).join('→') + '）。前日の体重は' + kg(w) + '。');
  const wasAuto = auto;
  auto = false;
  // --- 計量当日 ---
  setPlace('weighin');
  AudioSys.bgm('weighin');
  UI.note('公開計量。' + b.event, 'chosen');
  let over = w - L - allow;
  let passed = over <= 0;
  await scaleScene(w, L, passed);
  if (!passed) {
    await UI.say([Math.round(over * 1000) + 'gオーバー。', '会場がざわつく。', '再計量までの猶予は、およそ2時間。']);
    const i = await pickc([{ label: 'サウナで最後の追い込み', sub: '体へのダメージ大' }, { label: '諦めて、相手陣営と協議する' }]);
    if (i === 0) {
      w -= rf(0.25, 0.75) * (0.4 + cond / 120);
      cond -= 15; strain += 9; lastSauna = true;
      if (await collapseCheck(b, cond, strain, true)) return;
      over = w - L - allow; passed = over <= 0;
      await UI.say(['再計量。']);
      await scaleScene(w, L, passed);
    }
  }
  // ハイドレーションテスト（WON）
  if (hydra && passed && (usedWater || lastSauna) && chance(0.7)) {
    await UI.say(['ハイドレーションテスト。', '結果は――尿比重オーバー。不合格。', '試合当日の朝に再検査。体重と尿比重、両方を満たさなければならない。']);
    const ok = chance(0.35 + P.s.cut / 250);
    if (ok) await UI.say(['当日朝、水分を少しずつ戻しながら、ギリギリで両方クリアした。']);
    else { passed = false; over = rf(0.4, 1.4); await UI.say(['水を飲めば体重が戻る。飲まなければ検査に通らない。', '当日の計量にも失敗した。']); }
    cond -= 8;
  }
  if (!passed) {
    if (!(await weightMiss(b, over))) return;
  } else {
    P.cutHard = pct > 0.1 ? P.cutHard + 1 : Math.max(0, P.cutHard - 1);
    AudioSys.sfx('cheer');
    UI.note('計量パス！ そのまま' + oppOf(b).n + 'とフェイスオフ。');
    await UI.faceoff(oppOf(b));
  }
  // 相手の計量オーバー
  if (passed && !b.title && chance(0.06)) {
    await UI.say(['相手の' + oppOf(b).n + 'が、計量オーバーした。', '陣営から「ファイトマネーの一部を渡すので、試合をしてほしい」と申し入れが来た。']);
    const i = await pickc([{ label: '受ける', sub: '相手は減点スタート' }, { label: '断る', sub: '試合は中止' }]);
    if (i === 1) { b.cancel = true; b.oppMissCancel = true; await UI.say(['試合は中止になった。', '団体の規定で、ファイトマネーの一部は支払われることになった。']); P.money += Math.round(b.pay * 0.5); return; }
    b.oppMinus = 1; b.bonusMoney = Math.round(b.pay * 0.25); b.oppCond = 0.94;
  }
  // --- リカバリー ---
  P.health = clamp(P.health + strain * (pct > 0.11 ? 1.4 : 1), 0, 100);
  const cut = Math.max(0, P.walk - w);
  if (!wasAuto) await UI.ask(['計量が終わった。ここからは、リカバリーの時間。']);
  const ropts = [
    { label: '経口補水液とおかゆで、少しずつ戻す', k: 'slow' },
    { label: '焼肉とラーメンで一気に爆食い', k: 'binge' },
    { label: '点滴でリカバリー', sub: '団体によっては禁止', k: 'iv' },
  ];
  const ri2 = wasAuto ? 0 : await pickc(ropts, { kind: 'recover' });
  const rk = ropts[ri2].k;
  let back = cut * { slow: 0.7, binge: 0.85, iv: 0.8 }[rk];
  if (rk === 'slow') cond += 20;
  if (rk === 'binge') { if (chance(0.35)) { cond += 2; await UI.say(['夜中に胃が痛くなった。', '当日は、少し体が重い。']); } else cond += 12; }
  if (rk === 'iv') {
    cond += 24;
    if (ivBan) { P.dope.iv = true; await UI.say(['ホテルで点滴を受けた。', '……あとで知った。UFXではアンチドーピング規定で、計量後の点滴は原則禁止されている。']); }
  }
  const oppBack = b.org === 'won' ? rf(0.5, 2) : rf(3, 8);
  const dayW = w + back;
  await UI.say([
    '試合当日の体重は' + kg(dayW) + '（計量から +' + kg(back) + '）。' + oppOf(b).n + 'は+' + kg(oppBack) + '戻してきたらしい。' + (oppBack - back > 3 ? '並ぶと、ひと回りデカく見える。' : ''),
  ]);
  cond = clamp(cond, 15, 105);
  const sizeGap = clamp((oppBack - back) / 40, -0.04, 0.06);
  b.cond = clamp(0.8 + cond / 100 * 0.23 - sizeGap, 0.72, 1.04);
  b.stStart = clamp(100 - (100 - cond) * 0.45, 45, 100);
  if (P.health >= 60 && !P.flags.healthWarn) {
    P.flags.healthWarn = true;
    await UI.say(['試合後の血液検査で、ドクターに言われた。', '「腎臓の数値が良くない。こういう減量を続けたら、本当に危ないよ」']);
  }
}

async function scaleScene(w, L, pass) {
  AudioSys.sfx('scale');
  await UI.scale(w, L, pass);
}
async function collapseCheck(b, cond, strain, re) {
  const p = clamp((40 - cond) / 70 + strain / 90 + P.health / 350 - 0.12, 0, 0.6);
  if (!chance(p)) return false;
  await UI.say([re ? 'サウナの中で、視界が真っ白になった。' : '練習中、急に視界が暗くなった。', '気がつくと、救急車の中だった。', '重度の脱水症状。ドクターストップで、試合は欠場になった。']);
  b.cancel = true; b.collapse = true;
  P.health = clamp(P.health + 22, 0, 100); P.trust = clamp(P.trust - 12, 0, 100);
  P.misses++;
  applyFx({ pop: -4, inj: 5 });
  await UI.say(['団体からの信頼は大きく下がった。', 'SNSには「プロ失格」「無茶な減量はやめて」という声が並んだ。']);
  P.cutHard += 2;
  return true;
}
async function weightMiss(b, over) {
  P.misses++; P.cutHard += 2;
  const lines = ['最終的に' + Math.round(over * 1000) + 'gオーバー。計量失敗。'];
  let fine = 0.2, accept = 0.8;
  if (b.org === 'rizen') {
    const red = over >= 1;
    fine = red ? 0.5 : 0.2;
    lines.push(red ? 'RIZENからレッドカード。ファイトマネーの50%減額。' : 'RIZENからイエローカード。ファイトマネーの20%減額。', '試合は減点1からスタート。', '勝っても無効試合（ノーコンテスト）。負ければ、そのまま黒星。');
    b.minus = 1; b.ncIfWin = true;
  } else if (b.org === 'ufx') {
    fine = over > 1 ? 0.3 : 0.2;
    lines.push('ファイトマネーの' + Math.round(fine * 100) + '%が、相手に支払われる。', 'キャッチウェイトでの試合になる。ボーナス対象外。');
  } else if (b.org === 'won') {
    fine = 0.2; accept = 0.6;
    lines.push('ファイトマネーの20%が没収。相手が合意すれば、キャッチウェイトで試合を行う。');
  } else {
    lines.push('減点1と、ファイトマネーの' + Math.round(fine * 100) + '%の罰金。');
    b.minus = 1;
  }
  if (b.title) {
    lines.push(P.champ ? '王座は計量失敗により剥奪。' : 'タイトルマッチは、相手が勝った場合のみ成立する。');
    if (P.champ) { P.champ = false; P.rank = 2; }
    b.title = false; b.titleVoid = true;
  }
  b.fine = fine;
  await UI.say(lines);
  applyFx({ pop: -4, trust: -12, fol: -2000 });
  if (!chance(accept)) {
    await UI.say(['相手陣営は試合を拒否した。', '大会当日、カードから自分の名前が消えた。', '「計量失敗で欠場」という見出しが、ネットに並ぶ。']);
    b.cancel = true; b.missCancel = true; P.trust = clamp(P.trust - 8, 0, 100);
    return false;
  }
  await UI.say(['相手陣営は試合を受けてくれた。', '「体重を作れないやつに、負けるわけにはいかない」']);
  return true;
}

/* ===== 試合後・引退・エンディング ===== */
async function postFight(b) {
  const o = oppOf(b);
  if (b.cancel) {
    UI.scene('train');
    UI.fightOff();
    if (b.missCancel || b.collapse) await UI.say(['ファイトマネーは0円。', '支払ったジム代と減量のための費用だけが残った。']);
    P.queue.unshift(); // no-op
    return;
  }
  const res = b.res;
  if (!res) return;
  let nc = false;
  if (res.win && b.ncIfWin) nc = true;
  // ---- 結果コール ----
  const winnerName = res.win ? fullName() : res.loss ? o.n : '';
  let call;
  if (res.method === '判定') {
    if (res.draw) call = '判定の結果……' + res.detail + '！ 引き分け！';
    else call = '判定' + (res.detail === 'ユナニマス' ? '3-0' : '2-1') + '、' + res.detail + 'で……勝者、' + winnerName + '！';
  } else {
    call = res.round + 'ラウンド ' + fmtTime(res.time) + '、' + res.detail + 'により……勝者、' + winnerName + '！';
  }
  await UI.announce(['結果……' + call]);
  UI.scene('train');
  if (res.method === '判定' && res.cards && RULES[b.rule].judging === 'must') await UI.say(['ジャッジ：' + res.cards.join(' / ')]);
  UI.fightOff();
  AudioSys.bgm(res.win ? 'victory' : 'defeat');
  if (nc) await UI.say(['……しかし、計量オーバーのため、この試合は無効試合（ノーコンテスト）となる。']);
  // ---- 記録 ----
  const rec = P.rec;
  const m = res.method;
  P.tmp.newBelt = null;
  const injBefore = P.injOut;
  const isFinish = recordResult(b, res, nc);
  if (P.tmp.newBelt) await bigEvent('王座獲得', P.tmp.newBelt, 'belt');
  else if (res.win && (m === 'KO' || m === 'TKO') && !P.flags.firstKO) { P.flags.firstKO = true; chron('初のKO勝利。', 'w'); await bigEvent('初KO勝利', 'vs ' + o.n + '　' + res.round + 'R ' + fmtTime(res.time), 'ko'); }
  // ---- マイク ----
  if (res.win && !nc) await micAppeal(b, res, o);
  else if (res.loss) await lossTalk(b, res, o);
  await postLife(b, res);
  // ---- 判定論争 ----
  if (res.method === '判定' && res.detail !== 'ユナニマス' && tierOf(b.org) >= 2 && chance(0.6)) await controversy(b, res, o);
  // ---- お金 ----
  let pay = b.pay;
  const lines = [];
  if (b.org === 'ufx' && !res.win) pay = Math.round(pay * 0.5); // ショー&ウィン
  if (b.fine) { lines.push('計量オーバーの罰金：−' + fmtMoney(b.pay * b.fine)); pay -= Math.round(b.pay * b.fine); }
  if (res.yellow) { lines.push('イエローカード：ファイトマネー減額'); pay = Math.round(pay * 0.85); }
  if (b.bonusMoney) { lines.push('相手の計量オーバー分：+' + fmtMoney(b.bonusMoney)); pay += b.bonusMoney; }
  let bonus = 0;
  if (res.win && isFinish && !nc) {
    if (isMajor(b.org)) bonus = chance(0.7) ? 100 : 50;
    else if (b.org === 'ufx') bonus = chance(0.45) ? 750 : 0;
    else if (b.org === 'won') bonus = chance(0.5) ? 750 : 0;
    else if (tierOf(b.org) >= 1) bonus = chance(0.5) ? 10 : 0;
  }
  if (bonus) lines.push((b.org === 'ufx' ? 'パフォーマンス・オブ・ザ・ナイト' : b.org === 'won' ? 'パフォーマンスボーナス' : 'KO・一本ボーナス') + '：+' + fmtMoney(bonus));
  pay += bonus;
  P.money += pay;
  lines.unshift('ファイトマネー：' + fmtMoney(b.pay) + (b.org === 'ufx' && res.win ? '＋ウィンボーナス' : ''));
  lines.push('受け取り合計：' + fmtMoney(pay));
  await UI.say([lines.join('　')]);
  // ---- 人気・ダメージ ----
  const popD = (res.win ? (isFinish ? 6 : 3) : -2) + (b.nye ? 4 : 0) + (b.title && res.win ? 6 : 0) + tierOf(b.org);
  const folD = Math.round((res.win ? (isFinish ? 1 : 0.4) : 0.15) * [300, 1500, 4000, 25000, 60000][tierOf(b.org)] * (1 + P.s.pop / 50));

async function dopingTest(b, res, nc) {
  const org = ORGS[b.org];
  let p = org.tests || 0;
  if (isMajor(b.org) && (b.title || b.gp || b.nye)) p = 1; // タイトル戦・GPは全員検査
  if (P.flags.ruleChange && b.org === 'rizen') p = Math.max(p, 0.5);
  if (b.org === 'ufx' && curYear() < 2015) p = 0.3; // 厳格な通年検査の導入前
  if (!chance(p)) {
    if (P.dope.use && (b.org === 'ufx' || b.org === 'won') && chance(0.5)) return outOfCompetition();
    return;
  }
  await UI.say(['試合後、ドーピング検査の係員に呼ばれた。「採尿をお願いします」']);
  let reason = null;
  if (P.dope.use && chance(0.55)) reason = 'use';
  else if (P.dope.quit && P.age - P.dope.quit <= 1 && chance(0.3)) reason = 'use';
  else if (P.dope.cold && chance(0.25)) reason = 'cold';
  else if (P.dope.suppRisk && chance(0.05)) reason = 'supp';
  else if (P.dope.iv && chance(0.5)) reason = 'iv';
  P.dope.iv = false;
  if (!reason) { await UI.say(['数週間後、結果が届いた。陰性。クリーンであることを証明できた。']); return; }
  await positive(b, res, nc, reason);
}
